<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAaa4Rs4vk2xq0PzXnb9tdLnt1oqqj4qa4",
    authDomain: "boxplaytv-b32d8.firebaseapp.com",
    databaseURL: "https://boxplaytv-b32d8-default-rtdb.firebaseio.com",
    projectId: "boxplaytv-b32d8",
    storageBucket: "boxplaytv-b32d8.firebasestorage.app",
    messagingSenderId: "165114643998",
    appId: "1:165114643998:web:d12cb70574ac11f29a100f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Diagnóstico interno: no mostrar avisos técnicos a los espectadores.
  window.mostrarDiagnosticoPresencia = function(mensaje, error = false) {
    const avisoAnterior = document.getElementById('boxplay-presence-debug');
    if (avisoAnterior) avisoAnterior.remove();
    if (error) console.warn('[BOXPLAYTV presencia]', mensaje);
    else console.debug('[BOXPLAYTV presencia]', mensaje);
  };

  // Función pública para registrar actividad. El componente React está en otro script
  // y no puede acceder directamente a la variable db de este módulo.
  window.registrarPresenciaBoxplay = async function(emailUsuario, deviceId) {
    const email = String(emailUsuario || '').trim().toLowerCase();
    const id = String(deviceId || '').trim();
    if (!email || !id) throw new Error('Falta el correo o el identificador del dispositivo.');
    const presenceId = encodeURIComponent(email) + '__' + id;
    await setDoc(doc(db, 'presencia', presenceId), {
      email,
      deviceId: id,
      lastSeenMs: Date.now(),
      estado: 'online'
    }, { merge: true });
    return true;
  };

  // Verifica suscripción Y valida deviceId (1 dispositivo por cuenta)
  window.verificarSuscripcion = async function(emailUsuario, deviceId) {
    try {
      const email = String(emailUsuario || '').trim().toLowerCase();
      if (!email) return { activo: false, razon: 'no_existe' };

      const docRef = doc(db, "suscripciones", email);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) return { activo: false, razon: 'no_existe' };

      const data = docSnap.data();
      const hoy = new Date();
      const expiracion = new Date(data.expires_at);

      if (data.status !== "active" || hoy > expiracion) {
        return { activo: false, razon: 'vencida' };
      }

      const devices = Array.isArray(data.devices) ? data.devices : [];

      if (devices.length === 0) {
        try { await updateDoc(docRef, { devices: [deviceId] }); } catch (e) {}
        return { activo: true, razon: 'ok', primerDispositivo: true };
      }

      if (devices.includes(deviceId)) {
        return { activo: true, razon: 'ok' };
      }

      return { activo: false, razon: 'dispositivo_no_autorizado' };

    } catch (error) {
      console.error("Error al verificar la suscripción:", error);
      return { activo: false, razon: 'error' };
    }
  };

  window.resetearDispositivos = async function(emailUsuario) {
    try {
      const email = String(emailUsuario || '').trim().toLowerCase();
      const docRef = doc(db, "suscripciones", email);
      await updateDoc(docRef, { devices: [] });
      return true;
    } catch (error) {
      console.error("Error al resetear dispositivos:", error);
      return false;
    }
  };
  window.dispatchEvent(new CustomEvent('boxplay:firebase-ready'));
</script>

        const calcularDiasRestantes = (expiresAtStr) => {
            if (!expiresAtStr) return 0;
            const hoy = new Date();
            const expiracion = new Date(expiresAtStr);
            const diferenciaMs = expiracion - hoy;
            const diasRestantes = Math.ceil(diferenciaMs / (1000 * 60 * 60 * 24));
            return diasRestantes > 0 ? diasRestantes : 0;
        };

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

            if (url.includes('drive.google.com')) {

                if (url.includes('/file/d/')) {

                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];

                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}
            try {

                        if (defaultStation) { setCurrentRadioStation(defaultStation); setIsRadioPlaying(true); }

                        setContent({ tv: tvChannels, movies: moviesList, movies2: movies2List, series: seriesList, animados: animadosList, tudum: tudumList });
                    } catch (err) {
                        console.error("Error cargando contenido", err);
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('boxplay_favs');
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                const storedTvFavs = safeStorage.getItem('boxplay_tv_favs');
                if (storedTvFavs) { try { setTvFavorites(JSON.parse(storedTvFavs)); } catch(e) {} }
                const storedRadioFavs = safeStorage.getItem('boxplay_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }
                const storedCW = safeStorage.getItem('boxplay_continue_watching');
                if (storedCW) { try { setContinueWatching(JSON.parse(storedCW)); } catch(e) {} }
                const storedWatched = safeStorage.getItem('boxplay_watched_eps');
                if (storedWatched) { try { setWatchedEpisodes(JSON.parse(storedWatched)); } catch(e) {} }
                const storedSearches = safeStorage.getItem('boxplay_recent_searches');
                if (storedSearches) { try { setRecentSearches(JSON.parse(storedSearches)); } catch(e) {} }

                init();
            }, []);

            useEffect(() => {
                let tvInterval;
                if (activeTab === 'tv' && selectedItem?.type === 'tv') {
                    tvInterval = setInterval(() => { setTvRefreshTrigger(prev => prev + 1); }, 480000);
                }
                return () => clearInterval(tvInterval);
            }, [activeTab, selectedItem]);

            useEffect(() => {
                if (activeTab === 'tv' && content.tv.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = content.tv.find(c => c.title.toLowerCase().includes('telerred') || c.title.toLowerCase().includes('tele red') || c.title.toLowerCase().includes('tele-red')) || content.tv[0];
                        if (telerredChannel) { setSelectedItem(telerredChannel); setIsLocked(false); }
                    }
                }
            }, [activeTab, content.tv]);

            useEffect(() => {
                if (!audioRef.current) {
                    const audio = new Audio();
                    audio.crossOrigin = "anonymous";
                    audio.preload = "none";
                    audio.onerror = () => { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); };
                    audio.onwaiting = () => setIsLoadingRadio(true);
                    audio.onplaying = () => { setIsLoadingRadio(false); setStreamError(false); };
                    audio.oncanplay = () => { setIsLoadingRadio(false); setStreamError(false); };
                    audioRef.current = audio;
                }
                const audio = audioRef.current;
                if (audio) audio.volume = radioVolume;

                if (currentRadioStation && activeTab === 'radio') {
                    const playAudio = () => { try { const p = audio.play(); if (p !== undefined) p.catch(() => { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); }); } catch (e) {} };
                    const targetUrl = currentRadioStation.url || currentRadioStation.stream || '';
                    if (audio.dataset.currentUrl !== targetUrl) {
                        setIsLoadingRadio(true); setStreamError(false); audio.dataset.currentUrl = targetUrl;
                        if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
                        if (targetUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                            hlsRef.current = hls;
                            hls.loadSource(targetUrl);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => { if (isRadioPlaying) playAudio(); });
                            hls.on(Hls.Events.ERROR, function (event, data) { if (data.fatal) { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); } });
                        } else {
                            audio.src = targetUrl;
                            audio.load();
                            if (isRadioPlaying) playAudio();
                        }
                    } else {
                        if (isRadioPlaying) playAudio(); else audio.pause();
                    }
                } else if (audioRef.current && activeTab !== 'radio') {
                    audioRef.current.pause();
                }
            }, [currentRadioStation, isRadioPlaying, activeTab]);

            useEffect(() => { if (audioRef.current) audioRef.current.volume = radioVolume; }, [radioVolume]);

            const recordContinueWatching = (item, episode = null) => {
                if (item.type === 'tv' || item.type === 'radio') return;
                const record = { ...item, lastEpisode: episode ? episode.title : null, lastEpisodeUrl: episode ? episode.url : null, timestamp: Date.now() };
                const itemId = item.id || item.title;
                const updated = [record, ...continueWatching.filter(c => (c.id || c.title) !== itemId)].slice(0, 6);
                setContinueWatching(updated);
                safeStorage.setItem('boxplay_continue_watching', JSON.stringify(updated));
                if (episode) markEpisodeAsWatched(item, episode, true);
            };

            const markEpisodeAsWatched = (item, episode, isWatched) => {
                const itemId = item.id || item.title;
                const epId = episode.id || episode.url;
                const currentWatched = { ...watchedEpisodes };
                if (!currentWatched[itemId]) currentWatched[itemId] = [];
                if (isWatched) { if (!currentWatched[itemId].includes(epId)) currentWatched[itemId].push(epId); }
                else { currentWatched[itemId] = currentWatched[itemId].filter(id => id !== epId); }
                setWatchedEpisodes(currentWatched);
                safeStorage.setItem('boxplay_watched_eps', JSON.stringify(currentWatched));
            };

            const addRecentSearch = (term) => {
                if (!term || !term.trim()) return;
                const cleaned = term.trim();
                const updated = [cleaned, ...recentSearches.filter(s => s.toLowerCase() !== cleaned.toLowerCase())].slice(0, 8);
                setRecentSearches(updated);
                safeStorage.setItem('boxplay_recent_searches', JSON.stringify(updated));
            };

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo || generatePlaceholder(title, 'tv'), group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const tvGroups = useMemo(() => {
                const groups = new Set(content.tv.map(c => c.group || 'General'));
                return ['ALL', ...Array.from(groups)];

            const toggleFavorite = (item) => {

                    const itemId = item.id || item.title;
                    const newTvFavs = tvFavorites.some(f => (f.id || f.title) === itemId) ? tvFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...tvFavorites];
                    setTvFavorites(newTvFavs);
                    safeStorage.setItem('boxplay_tv_favs', JSON.stringify(newTvFavs));
                } else if (item.type === 'radio') {
                    const itemId = item.id || item.title;
                    const newRadioFavs = radioFavorites.some(f => (f.id || f.title) === itemId) ? radioFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...radioFavorites];
                    setRadioFavorites(newRadioFavs);
                    safeStorage.setItem('boxplay_radio_favs', JSON.stringify(newRadioFavs));
                } else {
                    const itemId = item.id || item.title;
                    const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites];
                    setFavorites(newFavs);
                    safeStorage.setItem('boxplay_favs', JSON.stringify(newFavs));

            const isItemFavorite = (item) => {

                const itemId = item.id || item.title;

                return list;

                    if (playerElement) {

            const handlePlay = (item) => {

            const handlePlayRadioStation = (station) => { setCurrentRadioStation(station); setIsRadioPlaying(true); setStreamError(false); };

            const handleTabClick = (tab) => {

                window.history.pushState({ appState: 'main', activeTab: tab.id }, '');

                        const telerredChannel = content.tv.find(c => c.title.toLowerCase().includes('telerred') || c.title.toLowerCase().includes('tele red') || c.title.toLowerCase().includes('tele-red')) || content.tv[0];
                        if (telerredChannel) setSelectedItem(telerredChannel);

                        setCurrentRadioStation(def); setIsRadioPlaying(true);

                } else { setSelectedItem(null); }

            if (showIntro) return <IntroScreen onEnter={() => {

                if (def && !currentRadioStation) { setCurrentRadioStation(def); setIsRadioPlaying(true); }

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col relative selection:bg-cyan-500 selection:text-white w-full max-w-[100vw] overflow-x-hidden">

                                        <Icon name={tab.icon} size={14}/>

                                <Icon className="absolute left-3 top-2.5 text-slate-400" name="search" size={14}/>

                                )}
                            </>
                        )}
                    </main>

                    {showPaywallModal && (
                        <SinpePaywall
                            emailUsuario={emailUsuario}
                            onEmailChange={(email) => { setEmailUsuario(email); safeStorage.setItem('boxplay_user_email', email); }}
                            onVerificado={() => {
                                setIsSubscriberActive(true);
                                setShowPaywallModal(false);
                                window.history.pushState({ appState: 'main', activeTab }, '');
                            }}
                            onClose={() => {
                                setShowPaywallModal(false);
                                window.history.pushState({ appState: 'main', activeTab }, '');
                            }}
                        />
                    )}

                    {showDownloadPinModal && (
                        <div data-tv-dialog="true" role="dialog" aria-modal="true" className="fixed inset-0 z-[110] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass-panel p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl border border-cyan-500/30 animate-scale-in space-y-4">
                                <div className="flex justify-center"><div className="p-3.5 bg-cyan-500/15 rounded-2xl text-cyan-400 border border-cyan-500/30"><Icon name="download" size={24}/></div></div>
                                <h2 className="text-sm font-extrabold text-white mb-1">Descarga Segura</h2>
                                <p className="text-[11px] text-slate-400 mb-2">Introduce la clave de descarga</p>
                                <form onSubmit={(e) => { e.preventDefault(); if (downloadPinInput === '8384') { setShowDownloadPinModal(false); window.open(pendingDownloadUrl, '_blank'); } else { setDownloadPinError(true); setDownloadPinInput(''); } }}>
                                    <input type="password" maxLength="4" className="w-full bg-black/60 border border-slate-800 rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] text-white focus:border-cyan-500 outline-none mb-3 shadow-inner" value={downloadPinInput} onChange={(e) => { setDownloadPinInput(e.target.value); setDownloadPinError(false); }} placeholder="••••" autoFocus />
                                    {downloadPinError && <p className="text-rose-400 text-xs mb-3 font-bold">Código incorrecto</p>}
                                    <div className="flex gap-2.5">
                                        <button type="button" onClick={() => { setShowDownloadPinModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="flex-1 py-2.5 rounded-xl border border-slate-800 text-slate-300 hover:bg-white/5 text-xs font-semibold">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2.5 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 text-white font-bold hover:brightness-110 text-xs shadow-[0_0_15px_rgba(6,182,212,0.5)]">Descargar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSmartViewModal && (
                        <div data-tv-dialog="true" role="dialog" aria-modal="true" className="fixed inset-0 z-[105] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass-panel rounded-3xl p-6 max-w-md w-full relative shadow-2xl space-y-4 animate-scale-in">
                                <button aria-label="Cerrar ayuda Smart TV" onClick={() => { setShowSmartViewModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1.5 rounded-full bg-black/40"><Icon name="x" size={18}/></button>
                                <div className="p-3 bg-cyan-500/20 rounded-2xl text-cyan-400 border border-cyan-500/30 inline-block"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg></div>
                                <h3 className="text-base font-extrabold text-white">Usar Boxplay TV con el mando</h3>
                                <div className="text-xs text-slate-300 space-y-3 text-left bg-black/50 p-4 rounded-2xl border border-slate-800 leading-relaxed">
                                    <p><strong>Android TV / Google TV, Samsung y LG:</strong><br/>Abre la dirección de Boxplay TV en el navegador del televisor.</p>
                                    <p><strong>Flechas:</strong> mueve el recuadro luminoso. <strong>OK:</strong> elige una opción o abre el teclado en pantalla.</p>
                                    <p><strong>Atrás:</strong> cierra el teclado, la ventana o el reproductor y vuelve a la pantalla anterior.</p>
                                    <p><strong>Reproducción:</strong> usa las teclas de reproducir y pausar, o los botones del video para volumen, subtítulos y pantalla completa.</p>
                                    <p>Los reproductores externos y los formatos disponibles dependen del proveedor y del modelo de televisor.</p>
                                </div>
                                <button aria-label="Cerrar ayuda Smart TV" onClick={() => { setShowSmartViewModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="w-full bg-cyan-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-cyan-500 transition-colors shadow-[0_0_15px_rgba(6,182,212,0.5)]">Entendido</button>
                            </div>
                        </div>
                    )}

                    {showQrModal && (
                        <div data-tv-dialog="true" role="dialog" aria-modal="true" className="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass-panel rounded-3xl p-6 max-w-xs w-full text-center relative shadow-2xl space-y-4 animate-scale-in">
                                <button aria-label="Cerrar código QR" onClick={() => { setShowQrModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1.5 rounded-full bg-black/40"><Icon name="x" size={18}/></button>
                                <div className="p-3 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 inline-block"><span className="text-xs font-black uppercase text-cyan-400 tracking-widest">Comunidad Boxplaytv</span></div>
                                <div className="bg-white p-3 rounded-2xl shadow-inner flex justify-center items-center">
                                    <img src={QR_IMAGE_URL} alt="Boxplaytv QR Code" className="w-40 h-40 object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                </div>
                                <div>
                                    <h3 className="font-extrabold text-base text-white">BOXPLAY<span className="text-cyan-400">TV</span></h3>
                                    <p className="text-xs text-slate-400 mt-1 leading-relaxed">Únete al grupo oficial de WhatsApp para estar al día con los estrenos.</p>
                                </div>
                                <a href={WHATSAPP_GROUP_URL} target="_blank" rel="noopener noreferrer" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-xs transition-colors shadow-[0_0_20px_rgba(16,185,129,0.5)] flex items-center justify-center gap-2"><span>Unirse al Grupo de WhatsApp</span></a>
                                <button aria-label="Cerrar código QR" onClick={() => { setShowQrModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="w-full bg-cyan-600 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-cyan-500 transition-colors shadow-[0_0_15px_rgba(6,182,212,0.4)]">Cerrar</button>
                            </div>
                        </div>
                    )}

                    <div data-tv-dialog="true" role="dialog" aria-modal="true" id="install-guide-modal" className="hidden fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="glass-panel rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl space-y-4 animate-scale-in">
                            <div className="p-3 bg-cyan-500/20 rounded-2xl text-cyan-400 border border-cyan-500/30 inline-block"><Icon name="download" size={24}/></div>
                            <h3 className="text-base font-extrabold text-white">Cómo Instalar Boxplaytv</h3>
                            <div className="text-xs text-slate-300 space-y-2 text-left bg-black/40 p-4 rounded-2xl border border-slate-800">
                                <p><strong>💻 En Windows / PC (Chrome, Edge, Brave):</strong><br/>Haz clic en el ícono de instalación o en el menú (⋮) y selecciona <em>'Instalar Boxplaytv'</em>.</p>
                                <p><strong>📱 En Android:</strong><br/>Toca el menú (⋮) y selecciona <em>'Instalar aplicación'</em> o <em>'Agregar a pantalla principal'</em>.</p>
                                <p><strong>🍏 En iPhone / iPad (Safari):</strong><br/>Toca el botón Compartir (⎋) y selecciona <em>'Agregar al inicio'</em>.</p>
                            </div>
                            <button onClick={() => document.getElementById('install-guide-modal').classList.add('hidden')} className="w-full bg-cyan-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-cyan-500 transition-colors shadow-[0_0_15px_rgba(6,182,212,0.5)]">Entendido</button>
                        </div>
                    </div>
                </div>
            );
        };

        const rootNode = document.getElementById('root');
        if (rootNode) {
            const root = ReactDOM.createRoot(rootNode);
            root.render(<App />);
        }
    </script>
    <script src="assets/app.js?v=3"></script>
</body>
</html>
