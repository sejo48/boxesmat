    <style>
        :root {
            --bg-primary: #020617;
            --accent-cyan: #06b6d4;
            --accent-teal: #14b8a6;
            --focus-color: #06b6d4;
        }

        * { box-sizing: border-box; }

        body { 
            background-color: var(--bg-primary); 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            width: 100%;
            min-height: 100vh;
            margin: 0;
            /* 🔥 Eliminamos la barra de scroll y el cursor para TV */
            cursor: none;
        }
        
        /* 🎯 Ocultar cursor en toda la app para TV */
        * { cursor: none !important; }

        /* 🎯 Estilo de FOCO para control remoto — muy visible desde el sofá */
        .tv-focus {
            outline: 4px solid var(--focus-color) !important;
            outline-offset: 4px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.9), 0 0 60px rgba(6, 182, 212, 0.5) !important;
            transform: scale(1.08);
            z-index: 50;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            position: relative;
        }

        .tv-focus::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 25px rgba(6,182,212,0.4); } 50% { box-shadow: 0 0 50px rgba(6,182,212,0.8); } }
        @keyframes vinylSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .animate-fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-in { animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .vinyl-animation { animation: vinylSpin 10s linear infinite; }
        .pulse-glow-box { animation: pulseGlow 3s infinite ease-in-out; }

        .video-container-fix iframe, .video-container-fix video {

        input[type=range] {

<body>

            <h2 style="font-weight: 700; font-size: 1.1rem; letter-spacing: 0.05em; color: #94a3b8;">Cargando BoxPlay TV...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ============================================================
        // 🎯 INICIALIZACIÓN DE NAVEGACIÓN ESPACIAL (CONTROL REMOTO)
        // ============================================================
        const SpatialNav = window.NoriginSpatialNavigation || (window.NoriginSpatialNavigationReact && window.NoriginSpatialNavigationReact.default);
        const SpatialNavReact = window.NoriginSpatialNavigationReact || window.NoriginSpatialNavigation;
        
        // Obtenemos las funciones principales
        const SN = window.NoriginSpatialNavigation || {};
        const useFocusable = SN.useFocusable || (SpatialNavReact && SpatialNavReact.useFocusable);
        const initSpatialNav = SN.init || (SpatialNavReact && SpatialNavReact.init);
        const setFocus = SN.setFocus || (SpatialNavReact && SpatialNavReact.setFocus);
        const updateAllLayouts = SN.updateAllLayouts || (SpatialNavReact && SpatialNavReact.updateAllLayouts);

        // Inicializamos el motor ANTES de renderizar
        if (initSpatialNav) {
            try {
                initSpatialNav({
                    debug: false,
                    visualDebug: false,
                    distanceCalculationMethod: 'corners',
                    shouldFocusDOMNode: true,
                    shouldUseNativeEvents: true,
                    throttle: 0,
                    throttleKeypresses: false,
                });
            } catch (e) {
                console.warn('SpatialNav init falló, usando fallback de teclado:', e);
            }
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: './peliculas.json',
            MOVIES2: './peliculas2.json',
            ANIMADOS: './animados.json',
            RADIOS: './radios.json',
            TUDUM: './tudum.json'
        };

        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json',
            MOVIES2: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json',
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json',
            TUDUM: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/tudum.json'
        };

        const WHATSAPP_GROUP_URL = 'https://chat.whatsapp.com/ClI93uJrk1A4hA8MoS1J7Z';
        const QR_IMAGE_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgsPiFVGiGuwJ3smwIQGJ-25kEkpEZpmR4PNZLdRF0_3LVfWAj2xhWSHiK7pY-C3jera3PD_XpmEtNy0kaCW1m8dayT9ebTV3YNBmbzMZeHF_oIf2XlniVGt6pj6BqtTyWEaUts1Ll_vYx2RuJvlrF9rqIwWcYcwMkTcdLCI-bShcR_KhhoILWEkdJ4Z4w/s1600/mi-qr-pro.png';

        const normalizeImageUrl = (value) => {
            if (typeof value !== 'string') return '';
            let url = value.trim().replace(/^['"]|['"]$/g, '');
            if (!url) return '';
            url = url.replace(/&amp;/gi, '&');
            if (url.startsWith('//')) url = 'https:' + url;
            if (url.startsWith('http://')) url = 'https://' + url.substring(7);
            return url;
        };

        const extractImageUrl = (obj) => {
            if (!obj || typeof obj !== 'object') return '';
            const fields = ['imagen', 'image', 'poster', 'img', 'logo', 'portada', 'cover', 'thumbnail', 'thumb', 'tvg-logo', 'backdrop'];
            for (const f of fields) {
                const value = normalizeImageUrl(obj[f]);
                if (value) return value;
            }
            return '';
        };

        const extractBackdropUrl = (obj) => {
            if (!obj || typeof obj !== 'object') return '';
            const value = normalizeImageUrl(obj.backdrop || obj.banner || obj.imagen || obj.image || obj.poster);
            return value;
        };

        const getImageCandidates = (url) => {
            const original = normalizeImageUrl(url);
            if (!original) return [];
            const candidates = [original];
            if (/^https?:\/\//i.test(original)) {
                candidates.push(`https://images.weserv.nl/?url=${encodeURIComponent(original)}`);
            }
            return [...new Set(candidates)];
        };

        const failedImageUrls = new Set();

        const generatePlaceholder = (title, type = 'poster') => {
            const safeTitle = (title || 'Sin Título').substring(0, 32).replace(/[<>&"']/g, '');
            if (type === 'tv') return `https://placehold.co/300x300/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
            if (type === 'backdrop') return `https://placehold.co/1280x720/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
            return `https://placehold.co/300x450/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
        };

        const RobustImage = ({ src, alt = '', title = alt, type = 'poster', className = '', ...props }) => {
            const candidates = useMemo(() => getImageCandidates(src), [src]);
            const fallback = generatePlaceholder(title, type);
            const [sourceIndex, setSourceIndex] = useState(0);

            useEffect(() => { setSourceIndex(0); }, [src]);

            const currentSrc = candidates[
                failedImageUrls.has(candidates[0]) && candidates.length > 1
                    ? Math.max(sourceIndex, 1)
                    : sourceIndex
            ] || fallback;

            const handleError = () => {
                if (currentSrc && currentSrc !== fallback) failedImageUrls.add(currentSrc);
                if (sourceIndex < candidates.length - 1) setSourceIndex(prev => prev + 1);
                else if (sourceIndex !== candidates.length) setSourceIndex(candidates.length);
            };

            return <img src={currentSrc} alt={alt || title} className={className} onError={handleError} referrerPolicy="no-referrer" {...props} />;
        };

        const DEFAULT_RADIO_STATIONS = [
            { id: 'cr-discofunk', title: 'B4B Disco Funk', group: 'Variedad', image: 'https://placehold.co/300x300/0f172a/ffffff?text=Disco+Funk', url: 'https://icecasthd.teletica.com/teleticaradio' },
            { id: 'cr-teletica', title: 'Teletica Radio: 91.5 FM', group: 'Variedad', image: 'https://placehold.co/300x300/0f172a/ffffff?text=Teletica+91.5', url: 'https://icecasthd.teletica.com/teleticaradio' },
            { id: 'cr-besame', title: 'Bésame Costa Rica', group: 'Variedad', image: 'https://placehold.co/300x300/06b6d4/ffffff?text=Besame', url: 'https://icecasthd.teletica.com/besame' },
            { id: 'cr-columbia', title: 'Columbia Estéreo', group: 'Variedad', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://icecasthd.teletica.com/columbia' },
            { id: 'cr-los40', title: 'Los 40 104.3 FM', group: 'Variedad', image: 'https://placehold.co/300x300/14b8a6/000000?text=Los40', url: 'https://icecasthd.teletica.com/los40' },
            { id: 'cr-bestfm', title: 'Best FM', group: 'Variedad', image: 'https://placehold.co/300x300/3b82f6/ffffff?text=Best+FM', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-sinfonola', title: 'Radio Sinfonola 90.3 FM', group: 'Romántica / Clásicos', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://live.turadio.stream:7006/;' },
            { id: 'cr-hit', title: 'Hit 104.7 FM', group: 'Juvenil / Pop', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-crc', title: 'CRC 94.7 FM', group: 'Alternativo / Rock', image: 'https://static.mytuner.mobi/media/tvos_radios/nAwNLxJbnm.png', url: 'https://23263.live.streamtheworld.com/CRC_947AAC_SC' },
            { id: 'cr-zeta', title: 'Zeta FM 95.1', group: 'Tropical / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/879/zeta-fm.feb3fb70.png', url: 'https://d5g44yionyslb.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-monumental', title: 'Radio Monumental 93.5 FM', group: 'Noticias / Deportes', image: 'https://static.mytuner.mobi/media/tvos_radios/574/radio-monumental.7303764d.png', url: 'https://d26gdpbozqq700.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-mejor', title: 'La Mejor 99.1 FM', group: 'Regional / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/575/la-mejor-991.95c72890.png', url: 'https://d3svz5xnvdysyz.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-r2', title: 'Radio Dos 99.5 FM', group: 'Clásicos / Rock', image: 'https://placehold.co/300x300/1e293b/ffffff?text=R2', url: 'https://icecasthd.teletica.com/radiodos' },
            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' },
            { id: 'cr-wao', title: 'WAO 92.3 FM', group: 'Urbano / Reggaeton', image: 'https://placehold.co/300x300/06b6d4/ffffff?text=WAO', url: 'https://icecasthd.teletica.com/wao' },
            { id: 'cr-musical', title: 'Radio Musical 97.5 FM', group: 'Romántica / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/085/radio-musical.fea3e089.jpg', url: 'https://live.turadio.stream:7005/stream/1/' }
        ];

        const FALLBACK_NETFLIX_TUDUM = [
            { title: "Stranger Things 5: El Desenlace", releaseDate: "Verano 2026", genre: "Ciencia Ficción / Terror", synopsis: "La batalla final por Hawkins ha comenzado.", image: "https://placehold.co/300x450/e50914/ffffff?text=Stranger+Things+5", trailerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", availability: "Costa Rica", score: "9.8 / 10" },
            { title: "The Electric State", releaseDate: "Próximamente 2026", genre: "Sci-Fi / Aventura", synopsis: "En un futuro retrofuturista, una adolescente huérfana viaja por el oeste americano.", image: "https://placehold.co/300x450/111827/ffffff?text=The+Electric+State", trailerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", availability: "Costa Rica", score: "9.2 / 10" },
            { title: "El Agente Nocturno: Temporada 2", releaseDate: "Otoño 2026", genre: "Acción / Suspenso", synopsis: "Peter Sutherland regresa con una nueva conspiración de alto nivel.", image: "https://placehold.co/300x450/0f172a/ffffff?text=The+Night+Agent+S2", trailerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", availability: "Costa Rica", score: "9.4 / 10" },
            { title: "One Piece: Temporada 2", releaseDate: "Invierno 2026", genre: "Fantasía / Acción", synopsis: "Monkey D. Luffy y su tripulación se adentran en la Grand Line.", image: "https://placehold.co/300x450/b91c1c/ffffff?text=One+Piece+S2", trailerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", availability: "Costa Rica", score: "9.6 / 10" }
        ];

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) { const parts = url.split('/file/d/'); if (parts[1]) fileId = parts[1].split('/')[0]; }
                else if (url.includes('id=')) { const parts = url.split('id='); if (parts[1]) fileId = parts[1].split('&')[0]; }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}
            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) return isJson ? await resRaw.json() : await resRaw.text();
            } catch (e) {}
            return null;
        };

        const parseM3U = (data) => {
            const lines = data.split('\n'); const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let title = 'Canal';
                    const url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (url && url.startsWith('http')) {
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                        const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                        channels.push({ id: `tv-${i}`, title, image: logo || generatePlaceholder(title, 'tv'), group, url, type: 'tv' });
                    }
                }
            }
            return channels;
        };

        // ============================================================
        // COMPONENTE GENÉRICO FOCUSEABLE — Envuelve cualquier elemento
        // ============================================================
        const Focusable = ({ 
            children, 
            onEnter, 
            onFocus, 
            focusKey, 
            className = '', 
            as: Component = 'div',
            ...props 
        }) => {
            // Fallback si la librería no cargó
            if (!useFocusable) {
                return (
                    <Component 
                        className={className} 
                        tabIndex={0} 
                        onClick={onEnter}
                        onKeyDown={(e) => { if (e.key === 'Enter') onEnter?.(); }}
                        {...props}
                    >
                        {children}
                    </Component>
                );
            }

            const { ref, focused } = useFocusable({
                focusKey,
                onEnterPress: onEnter,
                onFocus,
                focusable: true,
            });

            return (
                <Component
                    ref={ref}
                    className={`${className} ${focused ? 'tv-focus' : ''}`}
                    {...props}
                >
                    {children}
                </Component>
            );
        };

        // ============================================================
        // BOTÓN NAVEGABLE PARA EL MENÚ SUPERIOR
        // ============================================================
        const NavButton = ({ tab, active, onSelect, focusKey }) => {
            return (
                <Focusable
                    as="button"
                    focusKey={focusKey || `nav-${tab.id}`}
