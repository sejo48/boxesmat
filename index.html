                    <div className="glass-panel p-8 rounded-3xl border-2 border-cyan-500/30 relative overflow-hidden shadow-2xl pulse-glow-box flex flex-col md:flex-row items-center justify-between gap-8">
                        <div className="flex items-center gap-6 w-full md:w-auto">
                            <div className="relative w-32 h-32 rounded-full bg-black border-4 border-cyan-400 p-2 flex items-center justify-center shadow-[0_0_40px_rgba(6,182,212,0.6)] flex-shrink-0">
                                {currentStation?.image ? (
                                    <RobustImage src={currentStation.image} alt={currentStation.title} title={currentStation.title} type="tv" className={`w-full h-full object-cover rounded-full ${isPlaying ? 'vinyl-animation' : ''}`} />
                                ) : (
                                    <div className="w-full h-full rounded-full bg-cyan-950 flex items-center justify-center text-cyan-400"><Icon name="radio" size={40}/></div>
                                )}
                                <div className="absolute w-8 h-8 bg-cyan-500 rounded-full border-4 border-black flex items-center justify-center shadow-lg">
                                    <div className="w-3 h-3 bg-black rounded-full"></div>
                                </div>
                            </div>
                            <div className="space-y-2 min-w-0 flex-1">
                                <div className="flex items-center gap-3">
                                    <span className="px-3 py-1 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-xs font-mono text-cyan-300 font-bold uppercase tracking-widest">
                                        {isPlaying ? '🔴 EN DIRECTO' : '⏸ EN PAUSA'}
                                    </span>
                                </div>
                                <h1 className="text-3xl font-black text-white truncate orbitron">{currentStation ? currentStation.title : 'Selecciona una Emisora'}</h1>
                                <p className="text-base text-cyan-400 font-medium truncate">
                                    {currentStation?.group || 'Variedad Musical'} • {streamError ? 'Error en flujo' : isLoading ? 'Conectando...' : 'Alta Calidad HD'}
                                </p>
                            </div>
                        </div>
                        <div className="flex flex-col sm:flex-row items-center gap-5 w-full md:w-auto">
                            <div className="flex items-center gap-3 bg-black/60 px-5 py-4 rounded-2xl border border-slate-800 w-full sm:w-auto">
                                <Icon name="volume" size={20} className="text-cyan-400"/>
                                <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-40 accent-cyan-400"/>
                                <span className="text-base font-mono font-bold text-cyan-300 w-12 text-right">{Math.round(volume * 100)}%</span>
                            </div>
                            <div className="flex items-center gap-3 justify-center">
                                <Focusable as="button" focusKey="radio-prev" onEnter={handlePrev} className="p-4 rounded-2xl bg-black/60 text-cyan-300 border-2 border-slate-800" title="Anterior">
                                    <i className="fa-solid fa-backward-step text-xl"></i>
                                </Focusable>
                                <Focusable as="button" focusKey="radio-play" onEnter={handleTogglePlayPause} className="px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-600 to-teal-500 text-white font-extrabold text-base tracking-wider shadow-[0_0_20px_rgba(6,182,212,0.5)] flex items-center gap-3">
                                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-lg`}></i>
                                    <span>{isPlaying ? 'PAUSAR' : 'REPRODUCIR'}</span>
                                </Focusable>
                                <Focusable as="button" focusKey="radio-next" onEnter={handleNext} className="p-4 rounded-2xl bg-black/60 text-cyan-300 border-2 border-slate-800" title="Siguiente">
                                    <i className="fa-solid fa-forward-step text-xl"></i>
                                </Focusable>
                            </div>
                        </div>
                    </div>

                    {/* Lista de emisoras */}
                    <div className="glass-panel p-8 rounded-3xl border border-slate-800 flex flex-col shadow-xl">
                        <div className="flex flex-col sm:flex-row items-center justify-between mb-6 gap-4 pb-5 border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <Focusable as="button" focusKey="radio-tab-all" onEnter={() => setRadioViewMode('all')} className={`px-5 py-2.5 rounded-xl text-sm font-bold ${radioViewMode === 'all' ? 'bg-cyan-500 text-black' : 'bg-black/40 text-slate-400 border-2 border-slate-800'}`}>
                                    Todas ({stations.length})
                                </Focusable>
                                <Focusable as="button" focusKey="radio-tab-favs" onEnter={() => setRadioViewMode('favorites')} className={`px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 ${radioViewMode === 'favorites' ? 'bg-cyan-500 text-black' : 'bg-black/40 text-slate-400 border-2 border-slate-800'}`}>
                                    <Icon name="heart" size={14} fill={radioViewMode === 'favorites' ? 'black' : 'none'}/>
                                    <span>Favoritas ({radioFavorites.length})</span>
                                </Focusable>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                            {displayed.length === 0 ? (
                                <div className="col-span-full text-center py-20 text-slate-500 text-base font-medium">
                                    {radioViewMode === 'favorites' ? 'No tienes emisoras favoritas.' : 'No se encontraron emisoras.'}
                                </div>
                            ) : (
                                displayed.map((station, sIdx) => {
                                    const isCurrent = currentStation && (currentStation.id === station.id || currentStation.url === station.url);
                                    const isFav = isItemFavorite({ ...station, type: 'radio' });
                                    return (
                                        <Focusable 
                                            key={station.id || sIdx}
                                            focusKey={`radio-station-${station.id || sIdx}`}
                                            onEnter={() => onPlayStation(station)}
                                            className={`p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-center gap-4 ${
                                                isCurrent && isPlaying 
                                                    ? 'bg-cyan-950/60 border-cyan-500' 
                                                    : 'bg-black/40 border-slate-800/80'
                                            }`}
                                        >
                                            <div className="w-16 h-16 rounded-2xl bg-black border-2 border-slate-800 flex items-center justify-center overflow-hidden flex-shrink-0 p-1">
                                                {station.image ? (
                                                    <RobustImage src={station.image} alt={station.title} title={station.title} type="tv" className="w-full h-full object-cover rounded-xl" />
                                                ) : (
                                                    <Icon name="radio" size={24} className="text-slate-400"/>
                                                )}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className={`text-sm font-bold truncate ${isCurrent && isPlaying ? 'text-cyan-400' : 'text-white'}`}>{station.title}</h4>
                                                <span className="text-xs text-slate-400 truncate block mt-1">{station.group || 'Variedad'}</span>
                                            </div>
                                        </Focusable>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // APLICACIÓN PRINCIPAL
        // ============================================================
        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], movies2: [], animados: [], tudum: [] });
            const [radioStations, setRadioStations] = useState(DEFAULT_RADIO_STATIONS);
            const [search, setSearch] = useState('');
            const [recentSearches, setRecentSearches] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [isPlaying, setIsPlaying] = useState(false);
            const [detailTab, setDetailTab] = useState('info');
            const [favorites, setFavorites] = useState([]);
            const [tvFavorites, setTvFavorites] = useState([]);
            const [radioFavorites, setRadioFavorites] = useState([]);
            const [continueWatching, setContinueWatching] = useState([]);
            const [watchedEpisodes, setWatchedEpisodes] = useState({});
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showMobileMoreMenu, setShowMobileMoreMenu] = useState(false);
            const [tvRefreshTrigger, setTvRefreshTrigger] = useState(0);
            const [tvGroupFilter, setTvGroupFilter] = useState('ALL');
            const [currentRadioStation, setCurrentRadioStation] = useState(null);
            const [isRadioPlaying, setIsRadioPlaying] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const [radioFilter, setRadioFilter] = useState('');
            const [clockTime, setClockTime] = useState('12:34');

            const audioRef = useRef(null);
            const hlsRef = useRef(null);
            const tvContainerRef = useRef(null);
            const movieContainerRef = useRef(null);

            const navTabs = [
                { id: 'home', icon: 'search', label: 'Inicio' }, 
                { id: 'movies', icon: 'clapperboard', label: 'Películas' }, 
                { id: 'movies2', icon: 'star', label: 'Estrenos 2026' },
                { id: 'series', icon: 'film', label: 'Series' },
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'tv', icon: 'tv', label: 'TV en Vivo' }, 
                { id: 'radio', icon: 'radio', label: 'Radio HD' }, 
                { id: 'favorites', icon: 'heart', label: 'Favoritos' },
                { id: 'community', icon: 'chat', label: 'Comunidad' }
            ];

            // Reloj
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    setClockTime(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            // Manejo del botón "Atrás" del control remoto (Escape / Backspace / Back)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // El botón BACK de muchos controles envía Escape o Backspace
                    if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 10009 || e.keyCode === 8) {
                        // Prevenir que Backspace navegue hacia atrás en el navegador
                        if (e.key === 'Backspace') e.preventDefault();
                        
                        if (showQrModal) { setShowQrModal(false); return; }
                        if (selectedItem) {
                            if (isPlaying) {
                                if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
                                setIsPlaying(false);
                                return;
                            }
                            setSelectedItem(null);
                            setIsLocked(false);
                            setIsPlaying(false);
                            return;
                        }
                        if (activeTab !== 'home') { setActiveTab('home'); setSearch(''); return; }
                    }
                    // Botones de colores de algunos controles
                    if (e.keyCode === 415) { setShowQrModal(true); } // Botón verde
                    if (e.keyCode === 417) { setActiveTab('radio'); } // Botón azul
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedItem, activeTab, showQrModal, isPlaying]);

            // Carga inicial de datos
            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);
                        const [dataTV, dataSeries, dataAnimados, dataRadios, dataMovies, dataMovies2, dataTudum] = await Promise.all([ 
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            fetchSmart(URLS.MOVIES, RAW_URLS.MOVIES, true),
                            fetchSmart(URLS.MOVIES2, RAW_URLS.MOVIES2, true),
                            fetchSmart(URLS.TUDUM, RAW_URLS.TUDUM, true)
                        ]);

                        let tvChannels = [];
                        if (dataTV) tvChannels = parseM3U(dataTV);

                        let moviesList = [];
                        if (dataMovies) {
                            const rawMovies = Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || dataMovies.content || []);
                            moviesList = rawMovies.map((m, idx) => {
                                const title = m.titulo || m.title || m.name || `Película ${idx + 1}`;
                                const imgUrl = extractImageUrl(m);
                                return { ...m, id: `mov-1-${idx}`, type: 'movies', title, description: m.descripcion || m.sinopsis || m.plot || '', image: imgUrl || generatePlaceholder(title, 'poster'), backdrop: m.backdrop || m.banner || imgUrl, url: convertUrl(m.urlDrive || m.url || m.urlOkRu), rawUrl: m.urlDrive || m.url || m.urlOkRu };
                            });
                        }

                        let movies2List = [];
                        if (dataMovies2) {
                            const rawMovies2 = Array.isArray(dataMovies2) ? dataMovies2 : (dataMovies2.peliculas || dataMovies2.content || []);
                            movies2List = rawMovies2.map((m, idx) => {
                                const title = m.titulo || m.title || m.name || `Estreno ${idx + 1}`;
                                const imgUrl = extractImageUrl(m);
                                return { ...m, id: `mov-2-${idx}`, type: 'movies2', title, description: m.descripcion || m.sinopsis || m.plot || '', image: imgUrl || generatePlaceholder(title, 'poster'), backdrop: m.backdrop || m.banner || imgUrl, url: convertUrl(m.urlDrive || m.url || m.urlOkRu), rawUrl: m.urlDrive || m.url || m.urlOkRu };
                            });
                        }

                        let seriesList = [];
                        if (dataSeries) {
                            const rawSeries = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || []);
                            seriesList = rawSeries.map((s, idx) => {
                                const title = s.tituloSerie || s.titulo || s.title || s.name || `Serie ${idx + 1}`;
                                const imgUrl = extractImageUrl(s);
                                return { ...s, id: `serie-${idx}`, type: 'series', title, description: s.descripcion || s.sinopsis || '', image: imgUrl || generatePlaceholder(title, 'poster'), backdrop: s.backdrop || s.banner || imgUrl, seasons: (s.temporadas || []).map((t, tIdx) => ({ seasonNumber: t.numeroTemporada || (tIdx + 1), episodes: (t.episodios || []).map((ep, eIdx) => ({ id: `ep-${idx}-${tIdx}-${eIdx}`, title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`, url: convertUrl(ep.urlDrive || ep.url), rawUrl: ep.urlDrive || ep.url })) })) };
                            });
                        }

                        let animadosList = [];
                        if (dataAnimados) {
                            const rawAnimados = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || []);
                            animadosList = rawAnimados.map((a, idx) => {
                                const title = a.titulo || a.tituloSerie || a.title || a.name || `Animado ${idx + 1}`;
                                const imgUrl = extractImageUrl(a);
                                return { ...a, id: `anim-${idx}`, type: 'animados', title, description: a.descripcion || a.sinopsis || '', image: imgUrl || generatePlaceholder(title, 'poster'), backdrop: a.backdrop || a.banner || imgUrl, url: convertUrl(a.urlDrive || a.url), rawUrl: a.urlDrive || a.url, seasons: (a.temporadas || []).map((t, tIdx) => ({ seasonNumber: t.numeroTemporada || (tIdx + 1), episodes: (t.episodios || []).map((ep, eIdx) => ({ id: `ep-anim-${idx}-${tIdx}-${eIdx}`, title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`, url: convertUrl(ep.urlDrive || ep.url), rawUrl: ep.urlDrive || ep.url })) })) };
                            });
                        }

                        let loadedStations = DEFAULT_RADIO_STATIONS;
                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length > 0) {
                                loadedStations = list.map((r, idx) => {
                                    const title = r.titulo || r.title || r.name || `Emisora ${idx + 1}`;
                                    const imgUrl = extractImageUrl(r);
                                    return { ...r, id: r.id || `radio-fetched-${idx}`, title, group: r.group || r.genero || r.categoria || 'Variedad', image: imgUrl || generatePlaceholder(title, 'tv'), url: r.urlDrive || r.url || r.stream || r.urlStream || '', type: 'radio' };
                                });
                            }
                        }
                        loadedStations = loadedStations.map(s => ({ ...s, type: 'radio' }));
                        setRadioStations(loadedStations);

                        let tudumList = FALLBACK_NETFLIX_TUDUM;
                        if (dataTudum) {
                            const tList = Array.isArray(dataTudum) ? dataTudum : (dataTudum.tudum || dataTudum.estrenos || []);
                            if (tList.length > 0) {
                                tudumList = tList.map(t => {
                                    const title = t.titulo || t.title || 'Estreno';
                                    const imgUrl = extractImageUrl(t);
                                    return { title, releaseDate: t.fechaEstreno || t.releaseDate || 'Próximamente', genre: t.genero || t.genre || 'Estreno', synopsis: t.sinopsis || t.descripcion || t.synopsis || '', image: imgUrl || generatePlaceholder(title, 'poster'), trailerUrl: convertUrl(t.urlTrailer || t.trailerUrl || t.url), availability: t.disponibilidad || t.availability || 'Costa Rica', score: t.puntuacion || t.score || '9.0 / 10' };
                                });
                            }
                        }

                        const defaultStation = loadedStations.find(s => s.title.toLowerCase().includes('disco funk')) || loadedStations[0];
                        if (defaultStation) { setCurrentRadioStation(defaultStation); }

                        setContent({ tv: tvChannels, movies: moviesList, movies2: movies2List, series: seriesList, animados: animadosList, tudum: tudumList });
                    } catch (err) {
                        console.error("Error cargando contenido", err);
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('boxplay_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                const storedTvFavs = safeStorage.getItem('boxplay_tv_favs');
                if (storedTvFavs) { try { setTvFavorites(JSON.parse(storedTvFavs)); } catch(e) {} }
                const storedRadioFavs = safeStorage.getItem('boxplay_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }
                const storedCW = safeStorage.getItem('boxplay_continue_watching');
                if (storedCW) { try { setContinueWatching(JSON.parse(storedCW)); } catch(e) {} }
                const storedWatched = safeStorage.getItem('boxplay_watched_eps');
                if (storedWatched) { try { setWatchedEpisodes(JSON.parse(storedWatched)); } catch(e) {} }
                const storedSearches = safeStorage.getItem('boxplay_recent_searches');
                if (storedSearches) { try { setRecentSearches(JSON.parse(storedSearches)); } catch(e) {} }

                init();
            }, []);

            // Refresco automático de TV
            useEffect(() => {
                let tvInterval;
                if (activeTab === 'tv' && selectedItem?.type === 'tv') {
                    tvInterval = setInterval(() => { setTvRefreshTrigger(prev => prev + 1); }, 480000);
                }
                return () => clearInterval(tvInterval);
            }, [activeTab, selectedItem]);

            // Auto-seleccionar canal al entrar a TV
            useEffect(() => {
                if (activeTab === 'tv' && content.tv.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = content.tv.find(c => c.title.toLowerCase().includes('telerred') || c.title.toLowerCase().includes('tele red') || c.title.toLowerCase().includes('tele-red')) || content.tv[0];
                        if (telerredChannel) { setSelectedItem(telerredChannel); setIsLocked(false); }
                    }
                }
            }, [activeTab, content.tv]);

            // Manejo del audio de la radio
            useEffect(() => {
                if (!audioRef.current) {
                    const audio = new Audio();
                    audio.crossOrigin = "anonymous";
                    audio.preload = "none";
                    audio.onerror = () => { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); };
                    audio.onwaiting = () => setIsLoadingRadio(true);
                    audio.onplaying = () => { setIsLoadingRadio(false); setStreamError(false); };
                    audio.oncanplay = () => { setIsLoadingRadio(false); setStreamError(false); };
                    audioRef.current = audio;
                }
                const audio = audioRef.current;
                if (audio) audio.volume = radioVolume;

                if (currentRadioStation && activeTab === 'radio') {
                    const playAudio = () => { try { const p = audio.play(); if (p !== undefined) p.catch(() => { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); }); } catch (e) {} };
                    const targetUrl = currentRadioStation.url || currentRadioStation.stream || '';
                    if (audio.dataset.currentUrl !== targetUrl) {
                        setIsLoadingRadio(true); setStreamError(false); audio.dataset.currentUrl = targetUrl;
                        if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
                        if (targetUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                            hlsRef.current = hls;
                            hls.loadSource(targetUrl);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => { if (isRadioPlaying) playAudio(); });
                            hls.on(Hls.Events.ERROR, function (event, data) { if (data.fatal) { setIsRadioPlaying(false); setStreamError(true); setIsLoadingRadio(false); } });
                        } else {
                            audio.src = targetUrl; 
                            audio.load();
                            if (isRadioPlaying) playAudio();
                        }
                    } else {
                        if (isRadioPlaying) playAudio(); else audio.pause();
                    }
                } else if (audioRef.current && activeTab !== 'radio') {
                    audioRef.current.pause();
                }
            }, [currentRadioStation, isRadioPlaying, activeTab]);

            useEffect(() => { if (audioRef.current) audioRef.current.volume = radioVolume; }, [radioVolume]);

            // ====== FUNCIONES DE LÓGICA ======
            const recordContinueWatching = (item, episode = null) => {
                if (item.type === 'tv' || item.type === 'radio') return;
                const record = { ...item, lastEpisode: episode ? episode.title : null, lastEpisodeUrl: episode ? episode.url : null, timestamp: Date.now() };
                const itemId = item.id || item.title;
                const updated = [record, ...continueWatching.filter(c => (c.id || c.title) !== itemId)].slice(0, 6);
                setContinueWatching(updated);
                safeStorage.setItem('boxplay_continue_watching', JSON.stringify(updated));
            };

            const addRecentSearch = (term) => {
                if (!term || !term.trim()) return;
                const cleaned = term.trim();
                const updated = [cleaned, ...recentSearches.filter(s => s.toLowerCase() !== cleaned.toLowerCase())].slice(0, 8);
                setRecentSearches(updated);
                safeStorage.setItem('boxplay_recent_searches', JSON.stringify(updated));
            };

            const toggleFavorite = (item) => { 
                if (item.type === 'tv') {
                    const itemId = item.id || item.title;
                    const newTvFavs = tvFavorites.some(f => (f.id || f.title) === itemId) ? tvFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...tvFavorites];
                    setTvFavorites(newTvFavs);
                    safeStorage.setItem('boxplay_tv_favs', JSON.stringify(newTvFavs));
                } else if (item.type === 'radio') {
                    const itemId = item.id || item.title;
                    const newRadioFavs = radioFavorites.some(f => (f.id || f.title) === itemId) ? radioFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...radioFavorites];
                    setRadioFavorites(newRadioFavs);
                    safeStorage.setItem('boxplay_radio_favs', JSON.stringify(newRadioFavs));
                } else {
                    const itemId = item.id || item.title; 
                    const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                    setFavorites(newFavs); 
                    safeStorage.setItem('boxplay_favs', JSON.stringify(newFavs)); 
                }
            };

            const isItemFavorite = (item) => {
                if (!item) return false;
                const itemId = item.id || item.title;
                if (item.type === 'tv') return tvFavorites.some(f => (f.id || f.title) === itemId);
                if (item.type === 'radio') return radioFavorites.some(f => (f.id || f.title) === itemId);
                return favorites.some(f => (f.id || f.title) === itemId);
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' 
                    ? [...content.movies2, ...content.movies, ...content.series, ...content.animados] 
                    : activeTab === 'favorites' 
                    ? [...favorites.filter(item => item.type !== 'tv' && item.type !== 'radio'), ...tvFavorites] 
                    : content[activeTab] || []; 
                if (search && activeTab !== 'tv') return list.filter(i => (i.title || i.name || i.titulo || '').toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            
            const randomHeroItem = useMemo(() => {
                const pool = [...content.movies2, ...content.movies, ...content.series, ...content.animados];
                if (pool.length === 0) return null;
                return pool[Math.floor(Math.random() * pool.length)];
            }, [content]);

            const currentHeroItem = randomHeroItem || (content.movies.length ? content.movies[0] : null);

            const handleShowDetails = (item) => {
                if (item.type === 'tv') {
                    setSelectedItem(item);
                    setIsPlaying(false);
                    setIsLocked(false);
                    return;
                }
                setSelectedItem(item);
                setIsPlaying(false);
                setIsLocked(false);
                setDetailTab('info');
                setExpandedSeason(0);
                if (item.type === 'series' || item.type === 'animados') {
                    setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null);
                } else {
                    setSelectedEpisode(null);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePlayNow = (item, episode = null) => {
                const code = item.codigo || item.password || item.pin;
                setSelectedItem(item);
                setIsPlaying(true);
                setIsLocked(!!code);
                setExpandedSeason(0);
                
                if (item.type === 'series' || item.type === 'animados') {
                    const targetEp = episode || item.seasons?.[0]?.episodes?.[0] || null;
                    setSelectedEpisode(targetEp);
                    recordContinueWatching(item, targetEp);
                } else if (item.type === 'movies' || item.type === 'movies2') {
                    setSelectedEpisode(null);
                    recordContinueWatching(item, null);
                } else {
                    setSelectedEpisode(null);
                }
                
                if (search.trim()) addRecentSearch(search);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePlay = (item) => {
                if (item.type === 'tv') {
                    setSelectedItem(item);
                    setIsPlaying(false);
                    setIsLocked(false);
                    if (activeTab !== 'tv') setActiveTab('tv');
                } else {
                    handleShowDetails(item);
                }
            };

            const handlePlayRadioStation = (station) => { 
                setCurrentRadioStation(station); 
                setIsRadioPlaying(true); 
                setStreamError(false); 
            };

            const handleTabClick = (tab) => {
                if (tab.isExternal) { window.open(tab.url, '_blank'); }
                else {
                    setActiveTab(tab.id); 
                    setSearch(''); 
                    setIsLocked(false); 
                    setIsPlaying(false); 
                    if (tab.id === 'tv') {
                        if (!selectedItem || selectedItem.type !== 'tv') {
                            const telerredChannel = content.tv.find(c => c.title.toLowerCase().includes('telerred')) || content.tv[0];
                            if (telerredChannel) setSelectedItem(telerredChannel);
                        }
                    } else if (tab.id === 'radio') {
                        if (!currentRadioStation && radioStations.length > 0) {
                            const def = radioStations.find(s => s.title.toLowerCase().includes('disco funk')) || radioStations[0];
                            setCurrentRadioStation(def);
                        }
                    } else { 
                        setSelectedItem(null); 
                    }
                }
            };

            // ====== RENDER ======
            if (showIntro) return <IntroScreen onEnter={() => setShowIntro(false)} />;

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col w-full">
                    {/* HEADER NAVEGABLE */}
                    <header className="fixed top-0 left-0 right-0 z-50 glass-header px-6 py-4 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-8">
                            <Focusable 
                                as="div"
                                focusKey="logo"
                                onEnter={() => handleTabClick(navTabs[0])}
                                className="flex items-center gap-3 cursor-pointer"
                            >
                                <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-6 h-6 fill-white"><polygon points="40,30 70,50 40,70"/></svg>
                                </div>
                                <span className="font-black text-xl tracking-tight">BOXPLAY<span className="text-cyan-400">TV</span></span>
                            </Focusable>
                            <nav className="hidden lg:flex items-center gap-2">
                                {navTabs.slice(0, 8).map(tab => (
                                    <NavButton 
                                        key={tab.id} 
                                        tab={tab} 
                                        active={activeTab === tab.id} 
                                        onSelect={handleTabClick}
                                        focusKey={`nav-${tab.id}`}
                                    />
                                ))}
                            </nav>
                        </div>
                        <div className="flex items-center gap-3">
                            <Focusable 
                                as="div"
                                focusKey="clock"
                                className="px-4 py-2 rounded-xl bg-black/40 border border-slate-800 text-cyan-400 font-mono text-sm font-bold"
                            >
                                <i className="fa-solid fa-clock mr-2"></i>{clockTime}
                            </Focusable>
                            <Focusable 
                                as="button"
                                focusKey="header-qr"
                                onEnter={() => setShowQrModal(true)}
                                className="px-4 py-2.5 rounded-xl bg-cyan-500/15 text-cyan-300 border-2 border-cyan-500/30 text-sm font-bold flex items-center gap-2"
                            >
                                <Icon name="qr" size={16}/>
                                <span className="hidden lg:inline">Comunidad</span>
                            </Focusable>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 pt-24 pb-16 relative z-10 w-full">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-40">
                                <div className="animate-spin rounded-full h-16 w-16 border-4 border-cyan-500 border-t-transparent shadow-[0_0_25px_#06b6d4] mb-6"></div>
                                <p className="text-cyan-400 font-bold">Cargando contenido...</p>
                            </div>
                        ) : activeTab === 'radio' ? (
                            <CyberRadioSection 
                                stations={radioStations}
                                currentStation={currentRadioStation}
                                isPlaying={isRadioPlaying}
                                onPlayStation={handlePlayRadioStation}
                                volume={radioVolume}
                                setVolume={setRadioVolume}
                                streamError={streamError}
                                isLoading={isLoadingRadio}
                                audioRef={audioRef}
                                clockTime={clockTime}
                                radioFilter={radioFilter}
                                setRadioFilter={setRadioFilter}
                                radioFavorites={radioFavorites}
                                onToggleFavorite={toggleFavorite}
                                isItemFavorite={isItemFavorite}
                            />
                        ) : activeTab === 'community' ? (
                            <CommunitySection />
                        ) : activeTab === 'tv' ? (
                            /* ====== VISTA TV SIMPLIFICADA PARA TV ====== */
                            <div className="max-w-[1800px] mx-auto px-6 sm:px-10">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-2 h-7 bg-cyan-500 rounded-full shadow-[0_0_15px_#06b6d4]"></div>
                                    <h2 className="text-2xl font-black uppercase tracking-wider text-white">TV en Vivo</h2>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2">
                                    {content.tv.filter(c => !search || c.title.toLowerCase().includes(search.toLowerCase())).map((channel, idx) => (
                                        <Card 
                                            key={channel.id || idx}
                                            item={channel}
                                            focusKey={`tv-ch-${channel.id || idx}`}
                                            onClick={handlePlay}
                                            isFavorite={isItemFavorite(channel)}
                                            onToggleFavorite={toggleFavorite}
                                        />
                                    ))}
                                </div>
                            </div>
                        ) : selectedItem ? (
                            /* ====== DETALLES O REPRODUCTOR ====== */
                            <div className="animate-fade-in flex flex-col min-h-screen bg-[#020617] w-full">
                                {isPlaying ? (
                                    <div className="w-full bg-black relative h-screen flex items-center justify-center overflow-hidden video-container-fix">
                                        <div className="absolute top-6 left-6 z-30">
                                            <Focusable 
                                                as="button"
                                                focusKey="player-back"
                                                onEnter={() => { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); setIsPlaying(false); }}
                                                className="bg-black/80 text-white px-6 py-3 rounded-full backdrop-blur-md flex items-center gap-2 text-sm font-bold border-2 border-cyan-500/40"
                                            >
                                                <Icon name="arrowLeft" size={16}/> <span>Volver</span>
                                            </Focusable>
                                        </div>
                                        {isLocked ? (
                                            <LockScreen correctCode={selectedItem.codigo || selectedItem.password || selectedItem.pin} onUnlock={() => setIsLocked(false)} onCancel={() => setIsPlaying(false)} />
                                        ) : (
                                            <iframe src={convertUrl((selectedItem.type === 'series' || selectedItem.type === 'animados') && selectedEpisode ? selectedEpisode.url : selectedItem.url)} className="w-full h-full border-0 absolute inset-0 object-fill" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen></iframe>
                                        )}
                                    </div>
                                ) : (
                                    /* MODO DETALLES ESTILO NETFLIX */
                                    <div className="relative w-full pb-20">
                                        <div className="relative w-full" style={{ height: '80vh', minHeight: '600px' }}>
                                            <RobustImage 
                                                src={extractBackdropUrl(selectedItem) || extractImageUrl(selectedItem)} 
                                                alt={selectedItem.title || selectedItem.titulo} 
                                                title={selectedItem.title || selectedItem.titulo}
                                                type="backdrop"
                                                className="absolute inset-0 w-full h-full object-cover object-top"
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/70 to-transparent"></div>
                                            <div className="absolute top-6 left-6 right-6 z-30 flex items-center justify-between">
                                                <Focusable 
                                                    as="button"
                                                    focusKey="details-back"
                                                    onEnter={() => { setSelectedItem(null); setIsPlaying(false); }}
                                                    className="w-12 h-12 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center border-2 border-white/10"
                                                >
                                                    <Icon name="arrowLeft" size={20}/>
                                                </Focusable>
                                                <Focusable 
                                                    as="button"
                                                    focusKey="details-fav"
                                                    onEnter={() => toggleFavorite(selectedItem)}
                                                    className="w-12 h-12 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center border-2 border-white/10"
                                                >
                                                    <Icon name="heart" size={20} fill={isItemFavorite(selectedItem) ? "#06b6d4" : "none"} className={isItemFavorite(selectedItem) ? "text-cyan-400" : "text-white"}/>
                                                </Focusable>
                                            </div>
                                            <div className="absolute bottom-0 left-0 right-0 z-20 px-6 sm:px-16 pb-10">
                                                <div className="max-w-3xl space-y-5">
                                                    <h1 className="text-5xl sm:text-7xl font-black text-white leading-[0.95] tracking-tight uppercase drop-shadow-2xl">
                                                        {selectedItem.titulo || selectedItem.title || selectedItem.name}
                                                    </h1>
                                                    <div className="flex flex-wrap items-center gap-4 text-slate-300 text-base font-bold">
                                                        {selectedItem.clasificacion && <span>{selectedItem.clasificacion}</span>}
                                                        {selectedItem.runtime && <span>{selectedItem.runtime}</span>}
                                                        {selectedItem.year && <span>{selectedItem.year}</span>}
                                                        {selectedItem.rating && <span className="text-amber-300">⭐ {selectedItem.rating}</span>}
                                                    </div>
                                                    <div className="pt-4 flex gap-4">
                                                        <Focusable 
                                                            as="button"
                                                            focusKey="details-play"
                                                            onEnter={() => handlePlayNow(selectedItem, selectedEpisode)}
                                                            className="bg-white text-black px-10 py-4 rounded-lg font-black text-lg flex items-center gap-3 shadow-2xl"
                                                        >
                                                            <Icon fill="black" name="play" size={20}/> <span>Ver ahora</span>
                                                        </Focusable>
                                                        <Focusable 
                                                            as="button"
                                                            focusKey="details-fav-2"
                                                            onEnter={() => toggleFavorite(selectedItem)}
                                                            className="bg-black/60 backdrop-blur-md text-white px-8 py-4 rounded-lg font-black text-lg flex items-center gap-3 border-2 border-white/20"
                                                        >
                                                            <Icon name="heart" size={20} fill={isItemFavorite(selectedItem) ? "#06b6d4" : "none"} className={isItemFavorite(selectedItem) ? "text-cyan-400" : "text-white"}/>
                                                            <span>{isItemFavorite(selectedItem) ? 'En Mi lista' : 'Mi lista'}</span>
                                                        </Focusable>
                                                    </div>
                                                    <p className="text-slate-100 text-lg leading-relaxed pt-3 max-w-2xl">
                                                        {selectedItem.descripcion || selectedItem.sinopsis || "Sin descripción disponible."}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* EPISODIOS SI ES SERIE */}
                                        {((selectedItem.type === 'series' || selectedItem.type === 'animados') && selectedItem.seasons && selectedItem.seasons.length > 0) && (
                                            <div className="max-w-[1800px] mx-auto px-6 sm:px-16 pt-10">
                                                <div className="glass-panel rounded-2xl p-8">
                                                    <h3 className="font-black text-2xl text-white mb-6 flex items-center gap-3">
                                                        <span className="w-2 h-8 bg-cyan-500 rounded-full"></span> Episodios
                                                    </h3>
                                                    <div className="flex gap-3 mb-6 overflow-x-auto pb-2 no-scrollbar">
                                                        {selectedItem.seasons.map((season, sIdx) => (
                                                            <Focusable 
                                                                key={sIdx} 
                                                                focusKey={`season-${sIdx}`}
                                                                onEnter={() => setExpandedSeason(sIdx)} 
                                                                className={`px-6 py-3 rounded-lg text-sm font-bold whitespace-nowrap ${expandedSeason === sIdx ? 'bg-cyan-600 text-white' : 'bg-white/5 text-slate-400 border-2 border-slate-800'}`}
                                                            >
                                                                Temporada {season.seasonNumber}
                                                            </Focusable>
                                                        ))}
                                                    </div>
                                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                                        {selectedItem.seasons[expandedSeason]?.episodes?.map((ep, eIdx) => (
                                                            <Focusable 
                                                                key={ep.id || eIdx} 
                                                                focusKey={`ep-${expandedSeason}-${eIdx}`}
                                                                onEnter={() => handlePlayNow(selectedItem, ep)} 
                                                                className="p-4 rounded-xl flex items-center gap-4 bg-white/5 border-2 border-slate-800/50"
                                                            >
                                                                <div className="w-10 h-10 rounded-full bg-cyan-600 flex items-center justify-center text-white text-sm font-bold flex-shrink-0">
                                                                    {eIdx + 1}
                                                                </div>
                                                                <span className="text-base text-slate-200 truncate flex-1 font-medium">{ep.title}</span>
                                                                <Icon name="play" size={18} className="text-slate-500 flex-shrink-0"/>
                                                            </Focusable>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* ====== VISTAS DE LISTAS ====== */
                            <>
                                {activeTab === 'home' && (
                                    <>
                                        {currentHeroItem && <HeroSection item={currentHeroItem} onPlay={handlePlay} isFavorite={isItemFavorite(currentHeroItem)} onToggleFavorite={toggleFavorite} />}
                                        
                                        <div className="space-y-12 pb-20">
                                            {continueWatching.length > 0 && (
                                                <ContentRow title="▶️ Continuar Viendo" items={continueWatching} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} maxItems={7} />
                                            )}
                                            {content.movies2.length > 0 && (
                                                <ContentRow title="✨ Estrenos 2026" items={content.movies2} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                            )}
                                            <ContentRow title="🎬 Últimos Estrenos" items={content.movies} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                            <ContentRow title="🔥 Tendencias Actuales" items={content.animados} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                            <ContentRow title="⭐ Programas Populares" items={content.series} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                        </div>
                                    </>
                                )}
                                
                                {activeTab === 'favorites' ? (
                                    <div className="p-6 sm:p-12 max-w-[1800px] mx-auto w-full space-y-10">
                                        <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                                            <div className="p-3 bg-cyan-500/15 rounded-xl text-cyan-400 border border-cyan-500/30"><Icon fill="currentColor" name="heart" size={28}/></div>
                                            <div>
                                                <h2 className="text-3xl font-black text-white">Mis Favoritos</h2>
                                                <p className="text-sm text-slate-400">Tu colección personal</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-5">
                                            {displayedItems.map((item, i) => (
                                                <Card 
                                                    item={item} 
                                                    key={item.id || item.title || i} 
                                                    focusKey={`fav-${item.id || item.title || i}`}
                                                    onClick={handlePlay} 
                                                    isFavorite={isItemFavorite(item)} 
                                                    onToggleFavorite={toggleFavorite} 
                                                />
                                            ))}
                                        </div>
                                        {displayedItems.length === 0 && (
                                            <div className="glass-panel p-16 rounded-2xl text-center text-slate-400 text-base">
                                                No tienes contenido en favoritos todavía.
                                            </div>
                                        )}
                                    </div>
                                ) : activeTab !== 'home' && (
                                    <div className="p-6 sm:p-12 max-w-[1800px] mx-auto w-full animate-fade-in">
                                        <div className="mb-8 flex items-center gap-4">
                                            <div className="w-2 h-8 bg-cyan-500 rounded-full shadow-[0_0_15px_#06b6d4]"></div>
                                            <h2 className="text-3xl font-black uppercase tracking-wide text-white">
                                                {activeTab === 'movies' ? 'Películas' : activeTab === 'movies2' ? 'Estrenos 2026' : activeTab === 'series' ? 'Series' : activeTab === 'animados' ? 'Animados' : activeTab}
                                            </h2>
                                        </div>
                                        {displayedItems.length === 0 ? (
                                            <div className="text-center py-24 text-slate-500 text-base">
                                                <p>No se encontraron resultados.</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-5">
                                                {displayedItems.map((item, i) => (
                                                    <Card 
                                                        item={item} 
                                                        key={item.id || item.title || i} 
                                                        focusKey={`list-${activeTab}-${item.id || item.title || i}`}
                                                        onClick={handlePlay} 
                                                        isFavorite={isItemFavorite(item)} 
                                                        onToggleFavorite={toggleFavorite} 
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {/* MODAL QR */}
                    {showQrModal && (
                        <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass-panel rounded-3xl p-8 max-w-md w-full text-center relative shadow-2xl space-y-5 animate-scale-in border-2 border-cyan-500/30">
                                <Focusable 
                                    as="button"
                                    focusKey="qr-close"
                                    onEnter={() => setShowQrModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 p-2 rounded-full bg-black/40"
                                >
                                    <Icon name="x" size={20}/>
                                </Focusable>
                                <div className="p-3 bg-cyan-500/10 rounded-2xl border border-cyan-500/30 inline-block">
                                    <span className="text-sm font-black uppercase text-cyan-400 tracking-widest">Comunidad Boxplaytv</span>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-inner flex justify-center">
                                    <img src={QR_IMAGE_URL} alt="QR" className="w-48 h-48 object-contain" />
                                </div>
                                <div>
                                    <h3 className="font-extrabold text-2xl text-white">BOXPLAY<span className="text-cyan-400">TV</span></h3>
                                    <p className="text-sm text-slate-400 mt-2">Únete al grupo oficial de WhatsApp</p>
                                </div>
                                <Focusable 
                                    as="a"
                                    focusKey="qr-whatsapp"
                                    onEnter={() => window.open(WHATSAPP_GROUP_URL, '_blank')}
                                    className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-base shadow-lg flex items-center justify-center gap-2"
                                >
                                    <span>Unirse al Grupo</span>
                                </Focusable>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // RENDER
        // ============================================================
        const rootNode = document.getElementById('root');
        if (rootNode) {
            ReactDOM.createRoot(rootNode).render(<App/>);
        }
    </script>
</body>
</html>
