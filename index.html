<!-- Tailwind CSS & React -->
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
    body {
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
        user-select: none;
    }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    
    /* Estilo clave para el control remoto: Elemento seleccionado en la TV */
    .tv-focusable {
        transition: all 0.2s ease;
    }
    .tv-focusable:focus, .tv-focusable.selected {
        outline: none;
        transform: scale(1.06);
        border-color: #06b6d4 !important;
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
        background-color: rgba(6, 182, 212, 0.15);
        z-index: 10;
    }
</style>


<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // CONTENIDO PRECONFIGURADO (Listo para instalar y ver, sin depender de descargas externas)
    const PRECONFIGURED_DATA = {
        categories: [
            { id: 'movies', name: 'Películas & Estrenos' },
            { id: 'series', name: 'Series' },
            { id: 'tv', name: 'Televisión en Vivo' },
            { id: 'music', name: 'Música & Radio' }
        ],
        movies: [
            { id: 'm1', title: 'Starsky & Hutch', type: 'movies', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Starsky+Hutch', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Acción policial clásica.' },
            { id: 'm2', title: 'La Novicia Rebelde', type: 'movies', image: 'https://placehold.co/300x450/14b8a6/ffffff?text=La+Novicia', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Clásico musical galardonado.' }
        ],
        series: [
            { id: 's1', title: 'La Isla de Gilligan', type: 'series', image: 'https://placehold.co/300x450/06b6d4/ffffff?text=Gilligans+Island', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Comedia de situación clásica.' }
        ],
        tv: [
            { id: 'tv1', title: 'Telered Costa Rica', type: 'tv', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Telered', url: 'https://www.youtube.com/embed/live_stream?channel=UC...', desc: 'Señal en directo nacional.' }
        ],
        music: [
            { id: 'r1', title: 'B4B Disco Funk', type: 'music', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Disco+Funk', url: 'https://icecasthd.teletica.com/teleticaradio', desc: 'Estudio de radio en vivo.' }
        ]
    };

    const App = () => {
        const [currentCat, setCurrentCat] = useState('movies');
        const [selectedIndex, setSelectedIndex] = useState(0);
        const [playingItem, setPlayingItem] = useState(null);

        const items = PRECONFIGURED_DATA[currentCat] || [];

        // Navegación por control remoto (D-Pad Flechas y OK)
        useEffect(() => {
            const handleKeyDown = (e) => {
                if (playingItem) {
                    if (e.key === 'Escape' || e.key === 'Backspace') {
                        setPlayingItem(null);
                    }
                    return;
                }

                if (e.key === 'ArrowRight') {
                    setSelectedIndex((prev) => Math.min(prev + 1, items.length - 1));
                } else if (e.key === 'ArrowLeft') {
                    setSelectedIndex((prev) => Math.max(prev - 1, 0));
                } else if (e.key === 'Enter') {
                    if (items[selectedIndex]) {
                        setPlayingItem(items[selectedIndex]);
                    }
                }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
        }, [items, selectedIndex, playingItem]);

        return (
            <div className="w-screen h-screen flex flex-col bg-[#020617] text-white overflow-hidden p-8">
                {/* Header de la Smart TV */}
                <header className="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
                    <div className="flex items-center space-x-4">
                        <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.5)]">
                            <span className="orbitron font-black text-xl">BOX</span>
                        </div>
                        <h1 className="orbitron font-black text-2xl tracking-wider text-cyan-400">BOXPLAY<span className="text-white">TV // SMART TV</span></h1>
                    </div>

                    {/* Pestañas de Categorías */}
                    <div className="flex space-x-4">
                        {PRECONFIGURED_DATA.categories.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => { setCurrentCat(cat.id); setSelectedIndex(0); }}
                                className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all border ${currentCat === cat.id ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.4)]' : 'bg-slate-900 text-slate-400 border-slate-800'}`}
                            >
                                {cat.name}
                            </button>
                        ))}
                    </div>
                </header>

                {/* Reproductor de Pantalla Completa si se selecciona un contenido */}
                {playingItem ? (
                    <div className="flex-1 relative bg-black rounded-3xl overflow-hidden border border-cyan-500/40 shadow-2xl flex items-center justify-center">
                        {playingItem.type === 'music' ? (
                            <div className="text-center space-y-4 p-8">
                                <div className="w-32 h-32 rounded-full border-4 border-cyan-500 mx-auto overflow-hidden animate-pulse shadow-[0_0_30px_rgba(6,182,212,0.8)]">
                                    <img src={playingItem.image} className="w-full h-full object-cover" />
                                </div>
                                <h2 className="orbitron text-2xl font-bold text-green-400">{playingItem.title}</h2>
                                <p className="text-sm text-slate-400">Reproduciendo audio en directo...</p>
                                <audio src={playingItem.url} autoPlay controls className="mx-auto mt-4"></audio>
                            </div>
                        ) : (
                            <iframe src={playingItem.url} className="w-full h-full border-0 absolute inset-0" allow="autoplay; fullscreen"></iframe>
                        )}
                        <button 
                            onClick={() => setPlayingItem(null)}
                            className="absolute top-6 left-6 bg-black/80 hover:bg-cyan-600 text-white px-5 py-2.5 rounded-xl border border-cyan-500/40 font-bold text-sm shadow-xl transition-all"
                        >
                            ← Volver al Menú (Atrás)
                        </button>
                    </div>
                ) : (
                    /* Cuadrícula de Contenido optimizada para TV */
                    <div className="flex-1 overflow-y-auto px-2 py-4">
                        <div className="grid grid-cols-4 gap-6">
                            {items.map((item, idx) => (
                                <div
                                    key={item.id}
                                    tabIndex="0"
                                    onClick={() => setPlayingItem(item)}
                                    className={`tv-focusable group relative aspect-[2/3] rounded-2xl overflow-hidden bg-slate-900 border-2 cursor-pointer ${selectedIndex === idx ? 'selected border-cyan-400' : 'border-slate-800'}`}
                                >
                                    <img src={item.image} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-4">
                                        <h3 className="font-extrabold text-base text-white group-hover:text-cyan-400 transition-colors">{item.title}</h3>
                                        <p className="text-xs text-slate-400 line-clamp-1 mt-1">{item.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.createRoot(rootNode).render(<App/>);
</script>
