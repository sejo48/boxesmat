<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BoxPlay TV</title>
<style>html,body{margin:0;height:100%;background:#020617;color:#94a3b8;font:30px Verdana,sans-serif}#m{padding-top:440px;text-align:center}</style>
</head>
<body>
<div id="m">Cargando BoxPlay TV…</div>
<script>
/* =====================================================================
   BoxPlay TV - Adaptador para Smart TV
   Pon este archivo (tv.html) en la MISMA carpeta que tu index.html original.
   En el televisor abre:  .../tv.html        (modo compatible)
                          .../tv.html?rapido=1   (TVs modernos, arranca antes)
   ===================================================================== */
var ORIGINAL = 'index.html';
/* Si no está junto a tv.html (o abres esto en una vista previa), se descarga de tu repositorio */
var FALLBACK = 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/index.html';
var FALLBACK_BASE = 'https://sejo48.github.io/StreamTube-V20/';

/* ---------- Navegación con control remoto (se inyecta dentro de la app) ---------- */
function engine() {
  var cur = null, lc = { x: 960, y: 540 };
  var SEL = 'button,a[href],input,select,textarea,[tabindex="0"],.cursor-pointer';
  var BACK = [8, 27, 461, 10009, 166];

  var st = document.createElement('style');
  st.textContent = '*{cursor:none!important}' +
    '[data-tvf]{outline:5px solid #06b6d4!important;outline-offset:3px;box-shadow:0 0 34px rgba(6,182,212,.95)!important;transform:scale(1.05);transition:transform .12s}' +
    '.lg\\:hidden.fixed.bottom-0{display:none!important}';
  document.head.appendChild(st);

  try {
    if (window.tizen && tizen.tvinputdevice) {
      ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop'].forEach(function (k) {
        try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
      });
    }
  } catch (e) {}

  function vis(e) {
    var r = e.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    var s = getComputedStyle(e);
    return s.visibility !== 'hidden' && s.display !== 'none' && s.pointerEvents !== 'none';
  }

  /* Si hay una ventana encima (intro, PIN, modales) solo se navega dentro de ella */
  function scope() {
    var o = document.querySelectorAll('.fixed.inset-0,.absolute.inset-0.z-50'), s = null;
    for (var i = 0; i < o.length; i++) {
      var r = o[i].getBoundingClientRect();
      if (r.width > 200 && r.height > 200 && getComputedStyle(o[i]).display !== 'none') s = o[i];
    }
    return s || document;
  }

  function cands() {
    var sc = scope();
    var L = [].slice.call(sc.querySelectorAll(SEL)).filter(function (e) {
      return !e.disabled && e.type !== 'hidden' && vis(e);
    });
    var root = sc === document ? document.body : sc;
    return L.filter(function (e) {            /* gana el elemento más externo */
      for (var p = e.parentElement; p && p !== root; p = p.parentElement) {
        if (L.indexOf(p) > -1) return false;
      }
      return true;
    });
  }

  function pick(L) {
    var sc = scope(), i;
    if (sc !== document) {
      for (i = 0; i < L.length; i++) { if (L[i].tagName === 'INPUT') return L[i]; }
      return L[0];
    }
    for (i = 0; i < L.length; i++) {
      if (L[i].tagName === 'BUTTON' && /Ver ahora|Reproducir Ahora|Comenzar Experiencia/i.test(L[i].textContent || '')) return L[i];
    }
    var b = null, bd = 1e9;
    L.forEach(function (e) {
      var r = e.getBoundingClientRect();
      var d = Math.abs(r.left + r.width / 2 - lc.x) + Math.abs(r.top + r.height / 2 - lc.y);
      if (d < bd) { bd = d; b = e; }
    });
    return b;
  }

  function foc(el) {
    if (!el) return;
    if (cur) cur.removeAttribute('data-tvf');
    cur = el;
    el.setAttribute('data-tvf', '1');
    var a = document.activeElement;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) {
      try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    } else if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) {
      a.blur();
    }
    try { el.scrollIntoView({ block: 'center', inline: 'center' }); } catch (e) {}
    var r = el.getBoundingClientRect();
    lc = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function mv(d) {
    var L = cands();
    if (!L.length) return;
    if (!cur || L.indexOf(cur) < 0) { foc(pick(L)); return; }
    var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var best = null, bs = 1e9, hz = (d === 'l' || d === 'r');
    L.forEach(function (e) {
      if (e === cur) return;
      var b = e.getBoundingClientRect();
      var dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay, p, q, ok;
      if (d === 'r') { ok = dx > 5; p = dx; }
      else if (d === 'l') { ok = dx < -5; p = -dx; }
      else if (d === 'd') { ok = dy > 5; p = dy; }
      else { ok = dy < -5; p = -dy; }
      if (!ok) return;
      if (hz) { if (Math.abs(dy) > (a.height + b.height) / 2) return; q = Math.abs(dy) * 4; }
      else { q = Math.abs(dx) * 2; }
      if (p + q < bs) { bs = p + q; best = e; }
    });
    if (best) foc(best);
  }

  function goBack() { try { history.back(); } catch (e) {} }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, a = document.activeElement;
    var inp = a && /^(INPUT|TEXTAREA)$/.test(a.tagName), rng = inp && a.type === 'range';

    if (BACK.indexOf(k) > -1) {
      if (k === 8 && inp) return;               /* Backspace al escribir */
      e.preventDefault(); goBack(); return;
    }
    var d = { 37: 'l', 38: 'u', 39: 'r', 40: 'd' }[k];
    if (d) {
      if ((inp && (d === 'l' || d === 'r'))) return;   /* mover cursor / volumen */
      e.preventDefault(); mv(d); return;
    }
    if (k === 13) {
      if (inp || (a && a.tagName === 'SELECT')) return;
      if (cur && document.body.contains(cur)) { e.preventDefault(); cur.click(); }
    }
  }, true);

  /* Si la pantalla cambia y el foco se pierde, se recupera solo */
  function check() {
    if (cur && document.body.contains(cur) && vis(cur)) return;
    var L = cands();
    if (L.length) foc(pick(L));
  }
  var t = null;
  new MutationObserver(function () { clearTimeout(t); t = setTimeout(check, 250); })
    .observe(document.body, { childList: true, subtree: true });
  setTimeout(check, 1500);

  /* Si algo falla, se muestra en pantalla en vez de quedarse en "Cargando" */
  function showErr(msg) {
    var r = document.getElementById('root');
    if (r) r.innerHTML = '<div style="padding:80px;font:28px Verdana;color:#fff">Error al iniciar BoxPlay TV<br><br><span style="color:#06b6d4;font-size:22px">' + msg + '</span></div>';
  }
  window.addEventListener('error', function (e) { if (e && e.message && e.message !== 'Script error.') showErr(e.message); });
  setTimeout(function () {
    var r = document.getElementById('root');
    if (r && r.textContent.indexOf('Cargando Boxplaytv') > -1) {
      showErr('La app tarda demasiado en iniciar. Revisa el internet del televisor o prueba con tv.html?rapido=1');
    }
  }, 90000);
}

/* ---------- Carga el index.html original y lo corrige al vuelo ---------- */
(function () {
  var m = document.getElementById('m');
  var fast = /[?&]rapido=1/.test(location.search);

  function get(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url + '?t=' + new Date().getTime(), true);
    x.onerror = fail;
    x.onload = function () {
      var t = x.responseText || '';
      if (x.status >= 200 && x.status < 300 && /<html|<!doctype/i.test(t) && t.indexOf('text/babel') > -1) ok(t); else fail();
    };
    x.send();
  }

  function patch(h, remote) {
    h = h.replace(/<script>\s*if \(typeof Babel[\s\S]*?<\/script>/, '');
    h = h.replace('data-presets="react-classic"', 'data-presets="' + (fast ? 'react' : 'env,react') + '"');
    h = h.replace(/https:\/\/unpkg\.com\/react@18\/umd\/react\.development\.js/,
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js');
    h = h.replace(/https:\/\/unpkg\.com\/react-dom@18\/umd\/react-dom\.development\.js/,
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js');
    h = h.replace(/https:\/\/unpkg\.com\/@babel\/standalone\/babel\.min\.js/,
      (fast ? '' : 'https://cdn.jsdelivr.net/npm/regenerator-runtime@0.14.1/runtime.js"></' + 'script><script crossorigin src="') +
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js');
    h = h.replace('https://cdn.jsdelivr.net/npm/hls.js@latest', 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js');
    h = h.split('hidden lg:flex').join('flex');
    if (remote) h = h.replace('<head>', '<head><base href="' + FALLBACK_BASE + '">');
    h = h.replace('</body>', '<script>(' + engine.toString() + ')();<' + '/script></body>');
    document.open();
    document.write(h);
    document.close();
  }

  get(ORIGINAL, function (h) { patch(h, false); }, function () {
    m.textContent = 'Descargando la app desde el repositorio…';
    get(FALLBACK, function (h) { patch(h, true); }, function () {
      m.textContent = 'No se encontró index.html junto a tv.html ni en el repositorio. Sube tv.html a la carpeta de tu index.html.';
    });
  });
})();
</script>
</body>
</html>
