<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxplaytv - Smart TV IPTV Edition (Estrenos 2026)</title>
    
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .tv-focusable {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tv-focusable:focus, .tv-focusable.selected {
            outline: none;
            transform: scale(1.05) translateY(-4px);
            border-color: #06b6d4 !important;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
            background-color: rgba(6, 182, 212, 0.15);
            z-index: 20;
        }
        
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.8);
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
            50% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.8); }
        }
        .animate-glow {
            animation: pulse-glow 3s infinite;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col p-3 lg:p-4 select-none">

    <!-- Invitation Banner para boxplaytv.com -->
    <div class="bg-gradient-to-r from-cyan-950 via-teal-950 to-slate-900 border border-cyan-500/40 px-3 py-1.5 rounded-xl mb-2 flex items-center justify-between shrink-0 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            <p class="text-[11px] font-semibold text-cyan-200">
                ✨ ¿Buscas más contenido, series y canales? Visita nuestra plataforma en <a href="https://boxplaytv.com" target="_blank" class="text-cyan-400 font-bold underline hover:text-cyan-300 transition-colors">boxplaytv.com</a>
            </p>
        </div>
        <a href="https://boxplaytv.com" target="_blank" class="hidden sm:inline-flex bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-2.5 py-0.5 rounded-lg text-[10px] transition-colors shadow-md">
            Visitar boxplaytv.com
        </a>
    </div>

    <!-- Header de la Smart TV -->
    <header class="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-800/80 shrink-0">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                <span class="orbitron font-black text-sm text-white">BOX</span>
            </div>
            <div>
                <h1 class="orbitron font-black text-base tracking-wider text-cyan-400">BOXPLAY<span class="text-white">TV // IPTV</span></h1>
                <p id="current-time" class="text-[10px] text-slate-400 font-semibold tracking-wide">Cargando contenido...</p>
            </div>
        </div>

        <!-- Selector de Categorías / Listas -->
        <div class="flex items-center space-x-2" id="categories-bar">
            <button onclick="switchCategory('movies2')" id="cat-movies2" class="px-2.5 py-1 rounded-lg font-bold text-[11px] bg-cyan-500/20 text-cyan-300 border border-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.4)] transition-all cursor-pointer">Estrenos 2026</button>
            <button onclick="switchCategory('movies')" id="cat-movies" class="px-2.5 py-1 rounded-lg font-bold text-[11px] bg-slate-900 text-slate-400 border border-slate-800 transition-all cursor-pointer">Películas</button>
            <button onclick="switchCategory('series')" id="cat-series" class="px-2.5 py-1 rounded-lg font-bold text-[11px] bg-slate-900 text-slate-400 border border-slate-800 transition-all cursor-pointer">Series</button>
        </div>
    </header>

    <!-- Contenedor Principal / Reproductor -->
    <main id="main-container" class="flex-1 flex flex-col overflow-hidden relative">
        
        <!-- Vista de la Parrilla / Catálogo con portadas compactas -->
        <div id="grid-view" class="flex-1 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-2 px-1">
                <div class="flex items-center space-x-2">
                    <span id="loading-indicator" class="inline-block w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span>
                    <h2 id="category-title" class="orbitron font-bold text-xs sm:text-sm text-slate-200">Cargando catálogo IPTV...</h2>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-[10px] bg-slate-900 border border-slate-800 px-2 py-0.5 rounded-lg text-slate-400">
                        Navegación con <strong class="text-cyan-400">Flechas</strong> y <strong class="text-cyan-400">ENTER</strong>
                    </span>
                </div>
            </div>

            <!-- Grid optimizado con más columnas para portadas pequeñas y compactas -->
            <div class="flex-1 overflow-y-auto px-1 py-1 pr-2" id="grid-scroll-area">
                <div id="items-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 pb-4"></div>
            </div>
        </div>
        
        <!-- Vista del Reproductor de Vídeo (Pantalla Completa Forzada) -->
        <div id="player-view" class="hidden flex-1 relative bg-black rounded-xl overflow-hidden border border-cyan-500/40 shadow-2xl flex items-center justify-center">
            <div id="player-content" class="w-full h-full absolute inset-0"></div>
            
            <div class="absolute top-3 left-3 right-3 flex items-center justify-between z-30 pointer-events-none">
                <button onclick="closePlayer()" class="pointer-events-auto bg-black/80 hover:bg-cyan-600 text-white px-3 py-1.5 rounded-lg border border-cyan-500/40 font-bold text-[11px] shadow-xl transition-all cursor-pointer flex items-center space-x-1.5">
                    <span>← Volver al Menú (Esc / Atrás)</span>
                </button>
                <div id="playing-badge" class="bg-cyan-950/80 border border-cyan-500/50 backdrop-blur-md px-2.5 py-1 rounded-lg text-cyan-300 text-[10px] font-bold uppercase tracking-wider">
                    Reproduciendo • 4K HDR
                </div>
            </div>
        </div>
    </main>

    <!-- Footer con Guía y Mando Virtual Inteligente (Se oculta al usar mouse) -->
    <footer id="app-footer" class="mt-2 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400 shrink-0 transition-opacity duration-300">
        <div class="hidden sm:flex items-center space-x-3">
            <div class="flex items-center space-x-1">
                <span class="px-1.5 py-0.5 bg-slate-900 border border-slate-700 rounded text-cyan-400 font-mono font-bold text-[9px]">IZQ / DER / ARR / ABA</span>
                <span>Navegar</span>
            </div>
            <div class="flex items-center space-x-1">
                <span class="px-1.5 py-0.5 bg-slate-900 border border-slate-700 rounded text-cyan-400 font-mono font-bold text-[9px]">ENTER</span>
                <span>Reproducir</span>
            </div>
            <div class="flex items-center space-x-1">
                <span class="px-1.5 py-0.5 bg-slate-900 border border-slate-700 rounded text-cyan-400 font-mono font-bold text-[9px]">ESC</span>
                <span>Volver</span>
            </div>
        </div>

        <!-- Mando virtual compacto interactivo -->
        <div class="flex items-center space-x-1.5 bg-slate-900/90 border border-slate-800 p-1 rounded-xl shadow-lg mx-auto sm:mx-0">
            <button onclick="handleVirtualKey('ArrowLeft')" class="w-6 h-6 rounded-lg bg-slate-800 hover:bg-cyan-600 hover:text-white flex items-center justify-center transition-colors cursor-pointer font-bold text-[11px]">◀</button>
            <div class="flex flex-col space-y-0.5">
                <button onclick="handleVirtualKey('ArrowUp')" class="w-6 h-5 rounded-md bg-slate-800 hover:bg-cyan-600 hover:text-white flex items-center justify-center transition-colors cursor-pointer font-bold text-[9px]">▲</button>
                <button onclick="handleVirtualKey('ArrowDown')" class="w-6 h-5 rounded-md bg-slate-800 hover:bg-cyan-600 hover:text-white flex items-center justify-center transition-colors cursor-pointer font-bold text-[9px]">▼</button>
            </div>
            <button onclick="handleVirtualKey('ArrowRight')" class="w-6 h-6 rounded-lg bg-slate-800 hover:bg-cyan-600 hover:text-white flex items-center justify-center transition-colors cursor-pointer font-bold text-[11px]">▶</button>
            <button onclick="handleVirtualKey('Enter')" class="px-2 h-6 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition-colors cursor-pointer text-[10px] shadow-md">OK</button>
        </div>
    </footer>

    <script>
        // URLs oficiales de listas IPTV desde GitHub
        const URLS = {
            movies2: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/peliculas2.json',
            movies: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/peliculas.json',
            series: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/playlist.json'
        };

        let currentCat = 'movies2';
        let APP_DATA = {
            movies2: [],
            movies: [],
            series: []
        };
        let selectedIndex = 0;
        let isPlaying = false;
        let isMouseActive = false;

        // Detección de uso de Mouse: oculta el mando virtual si el usuario mueve el ratón
        window.addEventListener('mousemove', () => {
            if (!isMouseActive) {
                isMouseActive = true;
                const footer = document.getElementById('app-footer');
                if (footer) footer.style.opacity = '0.2';
            }
        });

        // Mostrar mando virtual si usa teclado o toque
        window.addEventListener('keydown', () => {
            if (isMouseActive) {
                isMouseActive = false;
                const footer = document.getElementById('app-footer');
                if (footer) footer.style.opacity = '1';
            }
        });

        // Reloj superior
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-time').textContent = `${timeStr} • 4K HDR • boxplaytv.com`;
        }, 1000);

        // Conversor de enlaces para iframe / reproductor con pantalla completa forzada
        function convertUrl(url) {
            if (!url) return '';
            if (url.includes('youtube.com') && !url.includes('/embed/')) {
                let videoId = '';
                if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}?autoplay=1&fs=1&enablejsapi=1`;
            }
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        }

        // Carga de todas las listas IPTV en vivo desde GitHub
        async function fetchIPTVData() {
            try {
                // Cargar Estrenos 2026
                const res2 = await fetch(URLS.movies2);
                const data2 = await res2.json();
                const raw2 = Array.isArray(data2) ? data2 : (data2.peliculas || data2.content || []);
                APP_DATA.movies2 = raw2.map((m, idx) => ({
                    id: `m2-${idx}`,
                    title: m.titulo || m.title || m.name || 'Estreno 2026',
                    image: m.imagen || m.poster || m.image || 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=300&auto=format&fit=crop&q=80',
                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu || 'https://www.youtube.com/embed/dQw4w9WgXcQ'),
                    desc: m.descripcion || m.sinopsis || m.plot || 'Estreno cinematográfico en alta definición.'
                }));

                // Cargar Películas Generales
                const res1 = await fetch(URLS.movies);
                const data1 = await res1.json();
                const raw1 = Array.isArray(data1) ? data1 : (data1.peliculas || data1.content || []);
                APP_DATA.movies = raw1.map((m, idx) => ({
                    id: `m1-${idx}`,
                    title: m.titulo || m.title || m.name || 'Película',
                    image: m.imagen || m.poster || m.image || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300&auto=format&fit=crop&q=80',
                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu || 'https://www.youtube.com/embed/dQw4w9WgXcQ'),
                    desc: m.descripcion || m.sinopsis || m.plot || 'Película IPTV.'
                }));

                // Cargar Series
                const res3 = await fetch(URLS.series);
                const data3 = await res3.json();
                const raw3 = Array.isArray(data3) ? data3 : (data3.series || []);
                APP_DATA.series = raw3.map((s, idx) => {
                    const firstEp = s.temporadas?.[0]?.episodios?.[0]?.urlDrive || s.temporadas?.[0]?.episodios?.[0]?.url || 'https://www.youtube.com/embed/dQw4w9WgXcQ';
                    return {
                        id: `s-${idx}`,
                        title: s.tituloSerie || s.titulo || s.title || s.name || 'Serie',
                        image: s.imagen || s.poster || s.image || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300&auto=format&fit=crop&q=80',
                        url: convertUrl(firstEp),
                        desc: s.descripcion || s.sinopsis || 'Serie IPTV.'
                    };
                });

                document.getElementById('loading-indicator').classList.remove('animate-ping');
                updateCategoryUI();
                renderGrid();
            } catch (err) {
                console.error("Error al cargar IPTV:", err);
                document.getElementById('category-title').textContent = "Catálogo IPTV (Modo Respaldo)";
                APP_DATA.movies2 = [
                    { id: 'e1', title: 'Stranger Things 5', image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=300&auto=format&fit=crop&q=80', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&fs=1', desc: 'La batalla final por Hawkins.' }
                ];
                updateCategoryUI();
                renderGrid();
            }
        }

        function switchCategory(cat) {
            currentCat = cat;
            selectedIndex = 0;
            updateCategoryUI();
            renderGrid();
        }

        function updateCategoryUI() {
            ['movies2', 'movies', 'series'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (!btn) return;
                if (c === currentCat) {
                    btn.className = "px-2.5 py-1 rounded-lg font-bold text-[11px] bg-cyan-500/20 text-cyan-300 border border-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.4)] transition-all cursor-pointer";
                } else {
                    btn.className = "px-2.5 py-1 rounded-lg font-bold text-[11px] bg-slate-900 text-slate-400 border border-slate-800 transition-all cursor-pointer";
                }
            });

            const titles = {
                movies2: `Estrenos 2026 (${APP_DATA.movies2.length} títulos)`,
                movies: `Películas IPTV (${APP_DATA.movies.length} títulos)`,
                series: `Series IPTV (${APP_DATA.series.length} títulos)`
            };
            document.getElementById('category-title').textContent = titles[currentCat] || 'Catálogo';
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            const items = APP_DATA[currentCat] || [];
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">Cargando contenido de la lista...</div>`;
                return;
            }

            // Tarjetas compactas y ligeras con texto sutil
            grid.innerHTML = items.map((item, idx) => `
                <div tabindex="0" onclick="playItem('${item.id}')" onmouseenter="selectedIndex=${idx}; updateFocusStyles();" class="tv-focusable group relative aspect-[2/3] rounded-md overflow-hidden bg-slate-900 border cursor-pointer ${selectedIndex === idx ? 'selected border-cyan-400 ring-1 ring-cyan-500/50' : 'border-slate-800'}">
                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/150x225/0f172a/ffffff?text=${encodeURIComponent(item.title)}'" />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent flex flex-col justify-end p-1">
                        <h3 class="font-bold text-[9px] text-white group-hover:text-cyan-300 transition-colors line-clamp-1">${item.title}</h3>
                    </div>
                </div>
            `).join('');

            updateFocusStyles();
        }

        function updateFocusStyles() {
            const items = document.querySelectorAll('#items-grid > div');
            items.forEach((el, idx) => {
                if (idx === selectedIndex) {
                    el.classList.add('selected', 'border-cyan-400');
                    el.classList.remove('border-slate-800');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                } else {
                    el.classList.remove('selected', 'border-cyan-400');
                    el.classList.add('border-slate-800');
                }
            });
        }

        function playItem(itemId) {
            const items = APP_DATA[currentCat] || [];
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            isPlaying = true;
            document.getElementById('grid-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');

            const playerContent = document.getElementById('player-content');
            const badge = document.getElementById('playing-badge');
            
            badge.textContent = `Reproduciendo • ${item.title}`;
            
            // Iframe con permisos completos de pantalla completa y reproducción automática
            playerContent.innerHTML = `
                <iframe src="${item.url}" class="w-full h-full border-0 absolute inset-0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            `;
            
            // Forzar solicitud automática de pantalla completa
            const playerView = document.getElementById('player-view');
            if (playerView.requestFullscreen) {
                playerView.requestFullscreen().catch(() => {});
            } else if (playerView.webkitRequestFullscreen) {
                playerView.webkitRequestFullscreen();
            }
        }

        function closePlayer() {
            isPlaying = false;
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('grid-view').classList.remove('hidden');
            document.getElementById('player-content').innerHTML = '';
            renderGrid();
        }

        function handleVirtualKey(key) {
            const items = APP_DATA[currentCat] || [];
            const totalItems = items.length;
            if (totalItems === 0) return;

            if (isPlaying) {
                if (key === 'Enter' || key === 'ArrowLeft' || key === 'Escape') closePlayer();
                return;
            }

            // 10 columnas en grid compacto optimizado para TV
            let numCols = 10;
            if (window.innerWidth < 640) numCols = 4;
            else if (window.innerWidth < 768) numCols = 6;
            else if (window.innerWidth < 1024) numCols = 8;

            if (key === 'ArrowRight') {
                selectedIndex = (selectedIndex + 1) % totalItems;
                renderGrid();
            } else if (key === 'ArrowLeft') {
                selectedIndex = (selectedIndex - 1 + totalItems) % totalItems;
                renderGrid();
            } else if (key === 'ArrowDown') {
                if (selectedIndex + numCols < totalItems) {
                    selectedIndex += numCols;
                } else {
                    const cats = ['movies2', 'movies', 'series'];
                    const nextCat = cats[(cats.indexOf(currentCat) + 1) % cats.length];
                    switchCategory(nextCat);
                    return;
                }
                renderGrid();
            } else if (key === 'ArrowUp') {
                if (selectedIndex - numCols >= 0) {
                    selectedIndex -= numCols;
                } else {
                    const cats = ['movies2', 'movies', 'series'];
                    const prevCat = cats[(cats.indexOf(currentCat) - 1 + cats.length) % cats.length];
                    switchCategory(prevCat);
                    return;
                }
                renderGrid();
            } else if (key === 'Enter') {
                if (items[selectedIndex]) playItem(items[selectedIndex].id);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (isPlaying) {
                if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'x') {
                    closePlayer();
                    e.preventDefault();
                }
                return;
            }

            const items = APP_DATA[currentCat] || [];
            let numCols = 10;
            if (window.innerWidth < 640) numCols = 4;
            else if (window.innerWidth < 768) numCols = 6;
            else if (window.innerWidth < 1024) numCols = 8;

            if (e.key === 'ArrowRight') {
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                renderGrid();
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                selectedIndex = Math.max(selectedIndex - 1, 0);
                renderGrid();
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                if (selectedIndex + numCols < items.length) {
                    selectedIndex += numCols;
                    renderGrid();
                } else {
                    const cats = ['movies2', 'movies', 'series'];
                    const nextCat = cats[(cats.indexOf(currentCat) + 1) % cats.length];
                    switchCategory(nextCat);
                }
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                if (selectedIndex - numCols >= 0) {
                    selectedIndex -= numCols;
                    renderGrid();
                } else {
                    const cats = ['movies2', 'movies', 'series'];
                    const prevCat = cats[(cats.indexOf(currentCat) - 1 + cats.length) % cats.length];
                    switchCategory(prevCat);
                }
                e.preventDefault();
            } else if (e.key === 'Enter') {
                if (items[selectedIndex]) playItem(items[selectedIndex].id);
                e.preventDefault();
            }
        });

        // Inicialización
        fetchIPTVData();
    </script>
</body>
</html>
