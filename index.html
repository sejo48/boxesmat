<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxplaytv - Smart TV Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .tv-focusable {
            transition: all 0.2s ease;
        }
        .tv-focusable:focus, .tv-focusable.selected {
            outline: none;
            transform: scale(1.06);
            border-color: #06b6d4 !important;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
            background-color: rgba(6, 182, 212, 0.15);
            z-index: 10;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col p-8">

    <!-- Header de la Smart TV -->
    <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.5)]">
                <span class="orbitron font-black text-xl text-white">BOX</span>
            </div>
            <h1 class="orbitron font-black text-2xl tracking-wider text-cyan-400">BOXPLAY<span class="text-white">TV // SMART TV</span></h1>
        </div>

        <!-- Pestañas de Categorías -->
        <div class="flex space-x-4" id="categories-container"></div>
    </header>

    <!-- Contenedor Principal / Reproductor -->
    <main id="main-container" class="flex-1 flex flex-col overflow-hidden">
        <div id="grid-view" class="flex-1 overflow-y-auto px-2 py-4">
            <div id="items-grid" class="grid grid-cols-4 gap-6"></div>
        </div>
        
        <div id="player-view" class="hidden flex-1 relative bg-black rounded-3xl overflow-hidden border border-cyan-500/40 shadow-2xl flex items-center justify-center">
            <div id="player-content" class="w-full h-full absolute inset-0"></div>
            <button onclick="closePlayer()" class="absolute top-6 left-6 bg-black/80 hover:bg-cyan-600 text-white px-5 py-2.5 rounded-xl border border-cyan-500/40 font-bold text-sm shadow-xl transition-all cursor-pointer z-20">
                ← Volver al Menú (Atrás)
            </button>
        </div>
    </main>

    <script>
        const DATA = {
            movies: [
                { id: 'm1', title: 'Starsky & Hutch', type: 'movies', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Starsky+Hutch', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Acción policial clásica.' },
                { id: 'm2', title: 'La Novicia Rebelde', type: 'movies', image: 'https://placehold.co/300x450/14b8a6/ffffff?text=La+Novicia', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Clásico musical galardonado.' }
            ],
            series: [
                { id: 's1', title: 'La Isla de Gilligan', type: 'series', image: 'https://placehold.co/300x450/06b6d4/ffffff?text=Gilligans+Island', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', desc: 'Comedia de situación clásica.' }
            ],
            tv: [
                { id: 'tv1', title: 'Telered Costa Rica', type: 'tv', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Telered', url: 'https://www.youtube.com/embed/live_stream?channel=UC...', desc: 'Señal en directo nacional.' }
            ],
            music: [
                { id: 'r1', title: 'B4B Disco Funk', type: 'music', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Disco+Funk', url: 'https://icecasthd.teletica.com/teleticaradio', desc: 'Estudio de radio en vivo.' }
            ]
        };

        const categories = [
            { id: 'movies', name: 'Películas & Estrenos' },
            { id: 'series', name: 'Series' },
            { id: 'tv', name: 'Televisión en Vivo' },
            { id: 'music', name: 'Música & Radio' }
        ];

        let currentCat = 'movies';
        let selectedIndex = 0;
        let isPlaying = false;

        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = categories.map(cat => `
                <button onclick="switchCategory('${cat.id}')" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all border cursor-pointer ${currentCat === cat.id ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.4)]' : 'bg-slate-900 text-slate-400 border-slate-800'}">
                    ${cat.name}
                </button>
            `).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('items-grid');
            const items = DATA[currentCat] || [];
            grid.innerHTML = items.map((item, idx) => `
                <div tabindex="0" onclick="playItem('${item.id}')" class="tv-focusable group relative aspect-[2/3] rounded-2xl overflow-hidden bg-slate-900 border-2 cursor-pointer ${selectedIndex === idx ? 'selected border-cyan-400' : 'border-slate-800'}">
                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-4">
                        <h3 class="font-extrabold text-base text-white group-hover:text-cyan-400 transition-colors">${item.title}</h3>
                        <p class="text-xs text-slate-400 line-clamp-1 mt-1">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function switchCategory(catId) {
            currentCat = catId;
            selectedIndex = 0;
            renderCategories();
            renderGrid();
        }

        function playItem(itemId) {
            const items = DATA[currentCat];
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            isPlaying = true;
            document.getElementById('grid-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');

            const playerContent = document.getElementById('player-content');
            if (item.type === 'music') {
                playerContent.innerHTML = `
                    <div class="text-center space-y-4 p-8 my-auto mx-auto">
                        <div class="w-32 h-32 rounded-full border-4 border-cyan-500 mx-auto overflow-hidden animate-pulse shadow-[0_0_30px_rgba(6,182,212,0.8)]">
                            <img src="${item.image}" class="w-full h-full object-cover" />
                        </div>
                        <h2 class="orbitron text-2xl font-bold text-green-400">${item.title}</h2>
                        <p class="text-sm text-slate-400">Reproduciendo audio en directo...</p>
                        <audio src="${item.url}" autoPlay controls class="mx-auto mt-4"></audio>
                    </div>
                `;
            } else {
                playerContent.innerHTML = `<iframe src="${item.url}" class="w-full h-full border-0 absolute inset-0" allow="autoplay; fullscreen"></iframe>`;
            }
        }

        function closePlayer() {
            isPlaying = false;
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('grid-view').classList.remove('hidden');
            document.getElementById('player-content').innerHTML = '';
            renderGrid();
        }

        window.addEventListener('keydown', (e) => {
            const items = DATA[currentCat] || [];
            if (isPlaying) {
                if (e.key === 'Escape' || e.key === 'Backspace') closePlayer();
                return;
            }

            if (e.key === 'ArrowRight') {
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                renderGrid();
            } else if (e.key === 'ArrowLeft') {
                selectedIndex = Math.max(selectedIndex - 1, 0);
                renderGrid();
            } else if (e.key === 'Enter') {
                if (items[selectedIndex]) playItem(items[selectedIndex].id);
            }
        });

        renderCategories();
        renderGrid();
    </script>
</body>
</html>
